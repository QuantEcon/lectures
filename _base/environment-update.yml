# The one environment the sites are to build in (QuantEcon/project-monorepo#77):
# what a build applies over the full image, ghcr.io/quantecon/quantecon
# (Python 3.13 and the anaconda=2026.07 metapackage, the base every series'
# environment.yml names), with QuantEcon/actions' setup-environment
# (`environment-update:`), which runs `conda env update` on the environment
# the build runs in. The site-build workflow builds with it every site whose
# site.yml sets `environment: base`: intro, advanced, programming and
# intermediate so far (QuantEcon/lectures#84, #86, #87 and the pull request
# that brought intermediate through); dp moves after its first shadow
# comparison (QuantEcon/project-monorepo#26, QuantEcon/project-monorepo#80).
# Each such site's execution cache is keyed on this file's entries, not on
# its comments or blank lines: a change to an entry executes every page of
# those sites again, and a change to a comment executes none.
#
# ONE UP-TO-DATE BASELINE (the owner's decisions of 2026-11-18 and -19): every
# version is exact, for stability while the sites' builds are first
# developed, and is the newest release on 2026-11-19, except
#   - a package the anaconda=2026.07 metapackage holds (pandas, plotly, rich,
#     seaborn, statsmodels, tabulate): its version there, the base every series
#     builds on;
#   - jupyter-book: the newest 1.x, until the engine switch;
#   - a version a lecture asks for (`"prettytable<3.18"`): the newest it allows.
# Where it moves the full image: quantecon-book-theme, sphinx-proof and
# sphinx-exercise stay at the image's versions; kaleido goes to 1.5.2 from the
# image's 0.2.1, and needs a Chrome: since QuantEcon/actions#346 (2026-11-19)
# both images carry Chrome for Testing 158.0.8127.36 at /opt/chrome, with
# BROWSER_PATH set (QuantEcon/actions#85, QuantEcon/actions#342); sphinx,
# markdown-it-py and alabaster go back to what jupyter-book 1.x needs, as in
# every series' build. The six series were
# brought to this baseline upstream by 2026-11-20, one pull request each.
#
# A person changes a pin, after testing (a workflow that watches for new
# releases is QuantEcon/project-monorepo#134). An entry without a version
# would not stay put: conda installs the pip list with `pip install -U`, so
# it would take the newest release on every build.
#
# THE LECTURES KEEP THEIR INSTALL LINES, for readers running a notebook on
# Colab or at home. In a build a plain `!pip install` finds the package
# already here. An `--upgrade` line, or a `!conda install` of a package pinned
# here, would replace the pin for the rest of that build, since every lecture
# runs in the same environment, so those lines were removed upstream by
# 2026-11-20. plotly-orca, which three of them installed from the plotly
# channel, has left this list with them: no pool lecture installs or uses it.
#
# tools/pool-check's `install-listed` rule keeps the list whole: every package
# a pool lecture's code cells install is listed here, at a version a pip
# install line's own limit allows (a conda install matches by name). A refresh
# that brings in a new install turns the pool-check red until a person pins it
# here, in a pull request of its own:
# drift-check rebuilds the refresh branch from main every night
# (_base/README.md).
#
# jax is the CPU wheel here. A GPU build adds `jax[cuda13]==0.12.1` on top,
# the same version, which brings the CUDA plugin and the CUDA libraries it
# bundles (nvidia-* wheels, not pinned here). The GPU machine image holds no
# anaconda metapackage, so the GPU leg creates that base first, from
# _base/environment.yml (QuantEcon/project-monorepo#77, the GPU leg).
# jax 0.11.1 hangs programming's numpy_vs_numba_vs_jax; 0.12.1 runs it, so the
# list moved from 0.11.0 to 0.12.1 (the owner's decision of 2026-11-19).

channels:
  - defaults
dependencies:
  - pip
  - pip:
    # The build stack: the series' environment.yml, at the newest releases
    - jupyter-book==1.0.4.post1
    - quantecon-book-theme==0.22.2
    - sphinx-tojupyter==0.6.0
    - sphinxext-rediraffe==0.3.0
    - sphinx-exercise==1.2.2
    - sphinx-proof==0.4.1
    - sphinxcontrib-youtube==1.5.0
    - sphinx-togglebutton==0.4.5
    - sphinx-reredirects==1.1.0
    # What the series' builds add: advanced's environment.yml (kaleido), the
    # GPU series' publish workflows (jax, numpyro)
    - jax==0.12.1
    - kaleido==1.5.2
    - numpyro==0.22.0
    # What the pool's lectures install for themselves
    - arviz==1.3.0
    - cvxopt==1.3.3
    - cvxpy==1.9.3
    - highspy==1.16.0
    - interpolation==2.2.7
    - keras==3.15.1
    - linearmodels==7.1
    - myst-nb==1.4.0
    - optax==0.2.9
    - pandas==3.0.3
    - pandas-datareader==0.11.1
    - plotly==6.7.0
    - polars==2.1.0
    - polytope==0.2.5
    - POT==0.9.7.post1
    - prettytable==3.17.0
    - pymc==6.4.0
    - quantecon==0.13.1
    - quantecon-book-networks==1.6
    - rich==15.0.0
    - seaborn==0.13.2
    - statsmodels==0.14.6
    - tabulate==0.10.0
    - wbgapi==1.0.14
    - xlrd==2.0.2
    - yfinance==1.8.0
