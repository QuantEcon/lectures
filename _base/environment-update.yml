# The one environment the sites are to build in (QuantEcon/project-monorepo#77):
# what a build applies over the full image, ghcr.io/quantecon/quantecon
# (Python 3.13 and the anaconda=2026.07 metapackage, the base every series'
# environment.yml names), with QuantEcon/actions' setup-environment
# (`environment-update:`), which runs `conda env update` on the environment
# the build runs in. Nothing builds with it yet: the site-build workflow moves
# to it in a later pull request, dp after its first shadow comparison
# (QuantEcon/project-monorepo#26, #80).
#
# ONE UP-TO-DATE BASELINE (the owner's decisions of 2026-11-18 and -19): every
# version is exact, for stability while the sites' builds are first
# developed, and is the newest release on 2026-11-19, except
#   - a package the anaconda=2026.07 metapackage holds (pandas, plotly, rich,
#     seaborn, statsmodels, tabulate): its version there, the base every series
#     builds on;
#   - jax: 0.11.0, as programming has it, since 0.11.1 hangs one of its
#     lectures (the owner's decision of 2026-11-17);
#   - jupyter-book: the newest 1.x, until the engine switch;
#   - a version a lecture asks for (`"prettytable<3.18"`): the newest it allows.
# Where it moves the full image: quantecon-book-theme, sphinx-proof and
# sphinx-exercise stay at the image's versions; kaleido goes to 1.5.1 from the
# image's 0.2.1, and needs a Chrome, which the image does not hold yet
# (QuantEcon/actions#85); sphinx, markdown-it-py and alabaster go back to what
# jupyter-book 1.x needs, as in every series' build. The six series are being
# brought to this baseline upstream, one pull request each.
#
# A person changes a pin, after testing (a workflow that watches for new
# releases is to be tracked on QuantEcon/project-monorepo#7). An entry without a version would
# not stay put: conda installs the pip list with `pip install -U`, so it would
# take the newest release on every build.
#
# THE LECTURES KEEP THEIR INSTALL LINES, for readers running a notebook on
# Colab or at home. In a build a plain `!pip install` finds the package
# already here. An `--upgrade` line, or a `!conda install` of a package pinned
# here, replaces the pin for the rest of that build, since every lecture runs
# in the same environment: those lines are being removed upstream. When they
# are gone, plotly-orca leaves this list too.
#
# tools/pool-check's `install-listed` rule keeps the list whole: every package
# a pool lecture's code cells install is listed here, at a version the
# lecture's own limit allows. A refresh that brings in a new install fails the
# pool-check until a person pins it here, in a pull request of its own:
# drift-check rebuilds the refresh branch from main every night (_base/README.md).
#
# jax is the CPU wheel here. A GPU build adds `jax[cuda13]==0.11.0` on top,
# the same version, which brings the CUDA plugin and the CUDA libraries it
# bundles (nvidia-* wheels, not pinned here). The GPU machine image holds no
# anaconda metapackage, so a GPU build needs that base as well
# (QuantEcon/project-monorepo#77, the GPU leg).

channels:
  - defaults
dependencies:
  - pip
  # three lectures install it from the plotly channel; their lines are being removed
  - plotly::plotly-orca==1.3.1
  - pip:
    # The build stack: the series' environment.yml, at the newest releases
    - jupyter-book==1.0.4.post1
    - quantecon-book-theme==0.22.2
    - sphinx-tojupyter==0.6.0
    - sphinxext-rediraffe==0.3.0
    - sphinx-exercise==1.2.2
    - sphinx-proof==0.4.1
    - sphinxcontrib-youtube==1.5.0
    - sphinx-togglebutton==0.4.5
    - sphinx-reredirects==1.1.0
    # What the series' builds add: advanced's environment.yml (kaleido), the
    # GPU series' publish workflows (jax, numpyro)
    - jax==0.11.0
    - kaleido==1.5.1
    - numpyro==0.22.0
    # What the pool's lectures install for themselves
    - arviz==1.3.0
    - cvxopt==1.3.3
    - cvxpy==1.9.3
    - highspy==1.16.0
    - interpolation==2.2.7
    - keras==3.15.1
    - linearmodels==7.1
    - myst-nb==1.4.0
    - optax==0.2.9
    - pandas==3.0.3
    - pandas-datareader==0.11.1
    - plotly==6.7.0
    - polars==2.1.0
    - polytope==0.2.5
    - POT==0.9.7.post1
    - prettytable==3.17.0
    - pymc==6.4.0
    - quantecon==0.13.1
    - quantecon-book-networks==1.6
    - rich==15.0.0
    - seaborn==0.13.2
    - statsmodels==0.14.6
    - tabulate==0.10.0
    - wbgapi==1.0.14
    - xlrd==2.0.2
    - yfinance==1.8.0
