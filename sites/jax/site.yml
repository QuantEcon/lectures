# The fields the build workflow reads for this site (sites/README.md, "site.yml").
# Sources: QuantEcon/lecture-jax at 7d8050c (the pin in sync/state.yml), read 2026-11-17; the same at 3431f12, 2026-11-27.
type: series
# the RunsOn GPU class its publish.yml and ci.yml run on
runner: g4dn.2xlarge
# seconds: execute.timeout in _config.yml; no workflow of the series sets a job time limit
cell_timeout: 2400
# its publish.yml runs three builds: pdflatex (the PDF), the jupyter builder (notebooks) and HTML
publishes: [html, pdf, notebooks]
# html.baseurl in _config.yml
url: https://jax.quantecon.org/
# the one environment every site is to build with (QuantEcon/project-monorepo#77),
# on the GPU leg: _base/environment.yml created on the RunsOn machine,
# _base/environment-update.yml applied and jax[cuda13] added (the owner's
# choice of 2026-11-22); jax is the last GPU site brought into it, after
# programming and intermediate, by the owner's order of 2026-11-22
environment: base
