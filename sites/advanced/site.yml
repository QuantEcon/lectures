# The fields the build workflow reads for this site (sites/README.md, "site.yml").
# Sources: QuantEcon/lecture-python-advanced.myst at 563576a (the pin in sync/state.yml), read 2026-11-17.
type: series
# what its publish.yml and ci.yml run on
runner: ubuntu-latest
# seconds: execute.timeout in _config.yml; no workflow of the series sets a job time limit
cell_timeout: 7200
# its publish.yml runs three builds: pdflatex (the PDF), the jupyter builder (notebooks) and HTML
publishes: [html, pdf, notebooks]
# html.baseurl in _config.yml
url: https://python-advanced.quantecon.org/
# the full image with _base/environment-update.yml, the one environment every
# site is to build with (QuantEcon/project-monorepo#77): advanced is the
# second site brought into it, after intro, by the owner's order of 2026-11-22;
# its three Kaleido lectures export images with the image's Chrome for Testing
# (/opt/chrome, BROWSER_PATH; QuantEcon/actions#346)
environment: base
