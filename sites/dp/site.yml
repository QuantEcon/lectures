# The fields the build workflow reads for this site (sites/README.md, "site.yml").
# Sources: QuantEcon/lecture-dp at da83d88 (the pin in sync/state.yml), read 2026-11-17.
type: series
# what its publish.yml and ci.yml run on
runner: ubuntu-latest
# seconds: execute.timeout in _config.yml; no workflow of the series sets a job time limit
cell_timeout: 2400
# its publish.yml runs two builds, the jupyter builder (notebooks) and HTML, since
# QuantEcon/lecture-dp#87 (at afb26ea, read 2026-11-26): no PDF
publishes: [html, notebooks]
# html.baseurl in _config.yml
url: https://quantecon.github.io/lecture-dp/
# installed before the build, as the image has no jax: mccall_risk, the site's
# addition from intermediate, imports it without installing it (the owner's
# decision, 2026-11-17); pip installs the CPU wheel on ubuntu-latest
extra_packages: [jax]
