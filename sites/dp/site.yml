# The fields the build workflow reads for this site (sites/README.md, "site.yml").
# Sources: QuantEcon/lecture-dp at da83d88 (the pin in sync/state.yml), read 2026-11-17.
type: series
# what its publish.yml and ci.yml run on
runner: ubuntu-latest
# seconds: execute.timeout in _config.yml; no workflow of the series sets a job time limit
time_limit: 2400
# its publish.yml builds HTML alone (build-lectures, builder: html): no PDF, no notebooks
publishes: [html]
# html.baseurl in _config.yml
url: https://quantecon.github.io/lecture-dp/
