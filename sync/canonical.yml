# sync/canonical.yml — HUMAN INTENT
#
# The canonical map: which series' copy the pool takes when two or more
# canonical-eligible series hold DIFFERENT files under one lecture name.
#
# tools/promote treats a same-named file as one lecture, so a copy that
# differs from the rest (after asset paths are normalised) is refused with an
# error naming the lecture and every series involved. Which copy survives must
# never fall out of run order. An entry here is the one exception: it names
# the winning series for that slug. The losing copies are recorded under
# `divergent:` in sync/ledger.yml, the entry is marked `interim: true`, and
# the drift-check reports their movement as info.
#
# An entry is a stop-gap. The fix is a rename or a merge upstream, after
# which the entry is deleted (promote warns when an entry settles nothing).
# A consumer series (`class: consumer` in sync/manifest.yml) is never
# canonical and cannot appear here; its copies are recorded as superseded.
#
# Format: one `<slug>: <series>` line per lecture, series keys as in
# sync/manifest.yml.
#
# Seeded 2026-10-06 (QuantEcon/project-monorepo#74) from the 24 entries that
# were `interim: true` in sync/ledger.yml: each keeps the canonical copy that
# promotion had picked by run order before this map existed, so the pool is
# unchanged. Every one is a dp-test collision, retired with dp-test itself.

career: intermediate                        # over dp-test
cons_news: dp-test                          # over advanced
ifp_advanced: intermediate                  # over dp-test
