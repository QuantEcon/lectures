# sync/bib.yml — how tools/bib-merge settles the series' bibliographies
#
# Human intent, hand-edited and reviewed (like sync/canonical.yml). The merged
# lectures/_static/quant-econ.bib is generated from the files of the series
# below and these rulings; it is never edited by hand.
#
# A ruling settles a key whose normalised copies differ (a conflict), or fixes
# a key the normalising cannot (a style fix):
#   take     the series whose copy the result starts from
#   set      fields to set on it          drop  fields to drop from it
#   type     the entry type to give it    because  why, with its source
#   seal     each series' copy, by digest, as it was when the ruling was made
# A ruling holds while every copy is its sealed version or already equal to
# the result. A copy edited to anything else reopens it: tools/bib-merge then
# refuses the key until it is ruled again (`tools/bib-merge --propose` prints
# a stub with a fresh seal).
#
# The rulings of 2026-11-02 implement QuantEcon/project-monorepo#10: the
# owner's 23 rulings, the four rules the owner accepted on 2026-10-12, and the
# style fixes of decision D3.
#
# `dp` is not listed (owner's decision of 2026-11-03). It is a topics series,
# a consumer in sync/manifest.yml: its lectures are copies of other series'
# lectures and its bibliography is a copy too, so it is never a source, and
# tools/bib-merge refuses a consumer here. Dropping it removed its copy from
# every seal, the Bertsekas75 ruling that only its copy needed, and the one
# key only it held (blume2006if, which no lecture cites).

