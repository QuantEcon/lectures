# sync/bib.yml — how tools/bib-merge settles the series' bibliographies
#
# Human intent, hand-edited and reviewed (like sync/canonical.yml). The merged
# lectures/_static/quant-econ.bib is generated from the files of the series
# below and these rulings; it is never edited by hand.
#
# A ruling settles a key whose normalised copies differ (a conflict), or fixes
# a key the normalising cannot (a style fix):
#   take     the series whose copy the result starts from
#   set      fields to set on it          drop  fields to drop from it
#   type     the entry type to give it    because  why, with its source
#   seal     each series' copy, by digest, as it was when the ruling was made
# A ruling holds while every copy is its sealed version or already equal to
# the result. A copy edited to anything else reopens it: tools/bib-merge then
# refuses the key until it is ruled again (`tools/bib-merge --propose` prints
# a stub with a fresh seal).
#
# The rulings of 2026-11-02 implement QuantEcon/project-monorepo#10: the
# owner's 23 rulings, the four rules the owner accepted on 2026-10-12, and the
# style fixes of decision D3.
#
# `dp` is not listed (owner's decision of 2026-11-03). It is a topics series,
# a consumer in sync/manifest.yml: its lectures are copies of other series'
# lectures and its bibliography is a copy too, so it is never a source, and
# tools/bib-merge refuses a consumer here. Dropping it removed its copy from
# every seal, the Bertsekas75 ruling that only its copy needed, and the one
# key only it held (blume2006if, which no lecture cites).
#
# On 2026-11-28 the 44 rulings tools/bib-merge reported as ruling-unneeded
# were removed (the owner's choice that day): every series' copy of each
# had come to equal the others, and none set or dropped a field, so the
# merged entries are unchanged without them. A copy that differs again
# is a conflict, refused until it is ruled anew.

series: [intro, intermediate, advanced, jax]
rulings:
  AKR1990:
    take: intermediate
    set: {publisher: Elsevier}
    because: 'owner''s ruling of 2026-11-02 (QuantEcon/project-monorepo#10): the Handbook of Computational Economics (1996), which Amman, Kendrick and Rust edited; the others say 1990 and list them as authors; re-sealed 2026-11-23, when intermediate''s copy took the result (QuantEcon/lecture-python.myst#1140)'
    seal: {intro: 7cc7b798cc306eb3, intermediate: 0517d1216224e38a, advanced: 7cc7b798cc306eb3, jax: 7cc7b798cc306eb3}
  hamburger1967computation:
    take: advanced
    drop: [publisher]
    because: 'rule: the same fact written two ways (#10): the journal''s own name, Econometrica; "publisher = JSTOR" is left out, as an article does not print it and the manual says to remove it; re-sealed 2026-11-22, when advanced''s copy took the result (QuantEcon/lecture-python-advanced.myst#420)'
    seal: {intro: b036b143f82511bd, intermediate: b036b143f82511bd, advanced: 41e739dc6614068b, jax: b036b143f82511bd}
  hansen1995discounted:
    take: intermediate
    set: {title: 'Discounted linear exponential quadratic {G}aussian control', journal: IEEE Transactions on Automatic Control}
    because: 'owner''s ruling of 2026-11-02 (QuantEcon/project-monorepo#10): Hansen and Sargent (1995), IEEE TAC; advanced''s copy is Hansen, Sargent and Tallarini (1999), which is HST_1999, and every citing sentence means the 1995 paper; Gaussian braced and the journal''s name corrected 2026-11-22, and advanced''s copy re-sealed when it took the result (QuantEcon/lecture-python-advanced.myst#420)'
    seal: {intermediate: ca1f2a81828ec3c7, advanced: d704144efd75e109}
  hansen2020twisted:
    take: intermediate
    set: {author: 'Hansen, Lars Peter and Sz\H{o}ke, B\''{a}lint and Han, Lloyd S. and Sargent, Thomas J.'}
    because: 'owner''s ruling of 2026-11-02 (QuantEcon/project-monorepo#10): Hansen, Szőke, Han and Sargent (2020), with the second author''s given name corrected to Bálint; advanced''s copy is a different paper; re-sealed 2026-11-23, when intermediate''s copy took the result (QuantEcon/lecture-python.myst#1140)'
    seal: {intermediate: 12c2453dc0203a9f, advanced: 89402ddf67159cac}
  Hansen_Jagannathan_1991:
    take: advanced
    drop: [url]
    because: 'owner''s ruling of 2026-11-02 (QuantEcon/project-monorepo#10): intermediate''s DOI points to the next article in the issue; the RePEc url is left out because the DOI exists (rule 9), as the owner ruled the same day; re-sealed 2026-11-22, when advanced''s copy took the result (QuantEcon/lecture-python-advanced.myst#420)'
    seal: {intermediate: fc2091edc196ecae, advanced: 93d63b4feacae11d}
  HansenRichard1987:
    take: intermediate
    set: {title: The Role of Conditioning Information in Deducing Testable Restrictions Implied by Dynamic Asset Pricing Models}
    because: 'rule: one copy is broken (#10): every copy misspells or truncates the title, corrected from the publisher''s record; re-sealed 2026-11-23, when intermediate''s copy took the result (QuantEcon/lecture-python.myst#1140)'
    seal: {intro: 3bbc65ca3cdefc33, intermediate: dff11e9d6d462585, advanced: ca75df9a41b3bb8b, jax: 3bbc65ca3cdefc33}
  Helpman1985:
    take: intermediate
    set: {year: '1985'}
    because: 'owner''s ruling of 2026-11-02 (QuantEcon/project-monorepo#10): the full title, with the year kept at 1985 (1987 is the paperback); re-sealed 2026-11-23, when intermediate''s copy took the result (QuantEcon/lecture-python.myst#1140)'
    seal: {intro: ac0c02587b4d71db, intermediate: 26992dc65b708457, advanced: ac0c02587b4d71db, jax: ac0c02587b4d71db}
  kemeny1956generalization:
    take: advanced
    drop: [publisher]
    because: 'rule: the same fact written two ways (#10): the journal''s own name, Econometrica; "publisher = JSTOR" is left out, as an article does not print it and the manual says to remove it; re-sealed 2026-11-22, when advanced''s copy took the result (QuantEcon/lecture-python-advanced.myst#420)'
    seal: {intro: ec40c4a35c10aeb7, intermediate: ec40c4a35c10aeb7, advanced: 7a8a2cfca70ed6d0, jax: ec40c4a35c10aeb7}
  Ljungqvist2012:
    take: advanced
    set: {publisher: MIT Press}
    because: 'rule: the same fact written two ways (#10): the fuller given names, and "MIT Press" over "The MIT Press"; re-sealed 2026-11-22, when advanced''s copy took the result (QuantEcon/lecture-python-advanced.myst#420)'
    seal: {intro: 48fe30fec593fbab, intermediate: 48fe30fec593fbab, advanced: c63920f7bd8c7767, jax: 48fe30fec593fbab}
  MarcetMarshall1992:
    take: intermediate
    set: {institution: Universitat Pompeu Fabra, type: Economics Working Paper}
    drop: [booktitle]
    type: techreport
    because: 'style fix (#10, decision D3): a working paper is an @techreport with its institution and number (rule 2); it was typed as an @incollection whose booktitle named the series; re-sealed 2026-11-23, when intermediate''s copy took the result (QuantEcon/lecture-python.myst#1140)'
    seal: {intermediate: 1340b06a614cbba3}
  ModiglianiBrumberg1954:
    take: intro
    set: {publisher: Rutgers University Press}
    because: 'style fix (#10, decision D3): an @incollection needs its publisher (rule 2); Post-Keynesian Economics (Kurihara, ed.) is Rutgers University Press, 1954; re-sealed 2026-11-22, when intro''s copy took the result (QuantEcon/lecture-python-intro#875)'
    seal: {intro: 1ca767d52640eaed, intermediate: 1b5b4d953cab4093, advanced: 1b5b4d953cab4093, jax: 1b5b4d953cab4093}
  pareto1896cours:
    take: intermediate
    drop: [volume]
    because: 'owner''s ruling of 2026-11-02 (QuantEcon/project-monorepo#10): a book (F. Rouge, Lausanne, 1896), the Cours cited as a whole: the income-distribution law is in volume II (1897), so volume 1 would point at the wrong volume; re-sealed 2026-11-23, when intermediate''s copy took the result (QuantEcon/lecture-python.myst#1140)'
    seal: {intro: b3ff36006857ebbb, intermediate: 04762a3685a82856, advanced: 0bff74c55a618d9c, jax: b3ff36006857ebbb}
  Phelan_Townsend_91:
    take: advanced
    drop: [url]
    because: 'rule: one copy has more fields (#10): advanced''s adds the DOI; its RePEc url is left out because the DOI exists (rule 9); re-sealed 2026-11-22, when advanced''s copy took the result (QuantEcon/lecture-python-advanced.myst#420)'
    seal: {intro: 61014964c2276bc7, intermediate: 61014964c2276bc7, advanced: 3d36111d3f983750, jax: 61014964c2276bc7}
  sargent1989least:
    take: intro
    set: {editor: William Barnett and John Geweke and Karl Shell}
    because: 'style fix (#10, decision D3): the editors were separated by commas and a stray comma before "and", so BibTeX read one malformed name; the same three names, joined by "and" (rule 3); re-sealed 2026-11-22, when intro''s copy took the result (QuantEcon/lecture-python-intro#875)'
    seal: {intro: 1bcb74219e915562}
  Spear_Srivastava_87:
    take: advanced
    drop: [url]
    because: 'rule: one copy has more fields (#10): advanced''s adds the DOI; its RePEc url is left out because the DOI exists (rule 9); re-sealed 2026-11-22, when advanced''s copy took the result (QuantEcon/lecture-python-advanced.myst#420)'
    seal: {intro: c59395ec8e29abba, intermediate: c59395ec8e29abba, advanced: c0bf35d9851dffb4, jax: c59395ec8e29abba}
  SvenssonWilliams2009:
    take: intermediate
    set: {title: 'Optimal Monetary Policy under Uncertainty in {DSGE} Models: A {Markov} Jump-Linear-Quadratic Approach'}
    because: 'rule: one copy is broken (#10): advanced''s editor list is truncated mid-name; the editors also list the series editors, which is #112''s to correct; DSGE and Markov braced 2026-11-22, since the reference style sets titles in sentence case (advanced''s copy braced the whole title), and advanced''s copy re-sealed when it took the result (QuantEcon/lecture-python-advanced.myst#420)'
    seal: {intro: 3603af09c33264d1, intermediate: 3603af09c33264d1, advanced: 78aa844ba6e29016, jax: 3603af09c33264d1}
