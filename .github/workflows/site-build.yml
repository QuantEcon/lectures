name: site-build

# Build the published sites from the pool, one leg per site, on Jupyter Book 1
# (QuantEcon/project-monorepo#77; dp first, QuantEcon/project-monorepo#25).
# Nothing here publishes: the build is checked, and its HTML and execution
# report are kept as artefacts; on a pull request each site built is also
# deployed as a preview (PREVIEWS, below). Publishing is its own item
# (QuantEcon/project-monorepo#78, rehearsed in QuantEcon/project-monorepo#27),
# and each series keeps building and publishing from its own repository until
# its cutover.
#
# WHICH SITES: the ones named in SITES below, today every folder in sites/:
# `dp`, `intro`, `advanced`, `programming`, `intermediate` and `jax`. A site
# joins SITES when it is brought through, so a pull request is never held up
# by a site that has not been. A pull request or a push to main builds only
# those its change reaches (tools/affected-sites, from the changed paths: a
# lecture builds the sites that list it, a site's own file that site, and any
# other input of the build every site; the owner's choice of 2026-11-27 for
# main). A pull request is compared with its base, and a push with the last
# build on main that succeeded, so a run cancelled or failed leaves nothing
# unbuilt (the first job's steps say how). The schedule and a manual run
# build them all, and when a change reaches none the build job is skipped.
# While a site stays red on main no build there succeeds, so each push
# builds all that has changed since the last green one: mend a red site
# first. To re-run an older push build, re-run its failed jobs, which keeps
# its matrix: re-running all its jobs after a later build has gone green
# compares it with that build, and may build none of its own change. The
# first job reads each named site's
# sites/<key>/site.yml (tools/site-matrix) and hands the matrix to the second:
# the runner class gives runs-on, the environment (below) the container and
# the file the cache key hashes, the job's time limit is site.yml's
# cell_timeout plus an allowance for a build from an empty cache (site.yml
# holds no job limit; tools/site-matrix says why), and extra_packages lists
# what the leg installs. The ubuntu-latest class builds in a container, the
# GPU class (g4dn.2xlarge) on a RunsOn machine with no container (THE GPU LEG,
# below). `fail-fast: false`, so one site's failure never stops another's
# build.
#
# THE ENVIRONMENT is site.yml's optional `environment` (sites/README.md):
#   series (the default; dp): ghcr.io/quantecon/quantecon-build:latest, the
#     lean image dp's own workflows build in, with nothing installed but
#     site.yml's extra_packages. dp stays here until its first shadow
#     comparison, so that comparison measures the move of the build alone
#     (QuantEcon/project-monorepo ideas/one-environment-for-every-site.md).
#   base (every site but dp; the GPU sites on the GPU leg, below): in a
#     container, ghcr.io/quantecon/quantecon:latest, the full image, whose
#     anaconda=2026.07 is what every series' environment.yml names, with
#     _base/environment-update.yml, the one package list every site is to
#     build with, applied by QuantEcon/actions' setup-environment (conda env
#     update in the image's environment). The image runs as root, so the
#     container leg sets PIP_ROOT_USER_ACTION=ignore: without it every install
#     cell's output carries pip's root-user warning, which the series' own
#     builds (not root) do not print. It also builds matplotlib's font cache
#     before the build, so no lecture's first plot prints that it is building
#     it.
#
# THE GPU LEG (the g4dn.2xlarge class: programming, intermediate and jax) runs
# on a RunsOn machine with one NVIDIA T4, from QuantEcon's GPU machine image
# (its AMI ID is in tools/site-matrix, the one the three GPU series'
# .github/runs-on.yml name), with no container, and in the base environment
# alone. It builds the same environment as the container's: setup-miniconda
# creates _base/environment.yml (Python 3.13 and anaconda=2026.07, what the
# full image carries), as the GPU series' own workflows create theirs;
# `conda env update` applies _base/environment-update.yml to it
# (setup-environment would update the machine image's own environment, which
# has no anaconda); and jax[cuda13], at the list's jax version, adds the CUDA
# plugin, with a check that jax finds the GPU. The owner chose this shape on
# 2026-11-22, after the environment scan of 2026-11-19 built the three GPU
# sites so with nothing new (QuantEcon/project-monorepo#77).
#
# Neither image is public: the build job pulls with its GITHUB_TOKEN, so it
# has `packages: read`, and each package's Actions access list (Manage
# Actions access, in the QuantEcon organisation's package settings) must
# include QuantEcon/lectures, which nothing here can check. Without that, the
# job fails in "Initialize containers" with unauthorized.
#
# EACH LEG, in its container or on its machine:
#   1. checks out with full history (the theme dates each page from git log);
#   2. in the series environment, reconstructs mirror/<key>/ at its pin
#      (tools/sync <key>: a sparse, shallow fetch of the series' lectures/
#      and environment.yml, a few seconds), for the one file the cache key
#      needs, environment.yml; in the base environment, applies
#      _base/environment-update.yml instead (on the GPU leg, creates the base
#      first and adds jax for CUDA after: above), and builds the font cache;
#   3. installs site.yml's extra_packages, if it has any, with pip into the
#      environment jb runs in. dp's is jax, the CPU wheel: the
#      image has none, and mccall_risk imports it without installing it.
#      Then it records the environment as installed (pip freeze), which the
#      execution report's artefact keeps;
#   4. restores the site's execution cache (below);
#   5. stages the site into lectures/ (tools/stage-site): its own pages and
#      files, and its _config.yml and _toc.yml, where `jb build lectures`
#      finds them with no --config or --toc, and where build-lectures' check
#      of the executed notebooks reads the configuration; for a consumer
#      site with site.yml's local_links, also its links to lectures it
#      carries made links within it (--local-links; sites/README.md);
#   6. builds HTML with QuantEcon/actions' build-lectures, `jb build lectures`,
#      strict: `-n -W --keep-going`, so a warning, a cell that raises, an
#      unresolved reference or a label two selected lectures both define
#      fails the build, and every failure is listed, not only the first.
#      The configuration's paths resolve as from the site's own folder: the
#      branding and the bibliography against lectures/, the execution cache
#      against the directory jb runs in, the repository's root;
#   7. writes execution_status.json (tools/execution-report): one row per page
#      executed or taken from the cache, with status, seconds, kernel and
#      which of the two; it runs after a failed build too;
#   8. for a site whose site.yml publishes notebooks, builds them with the
#      jupyter builder, strict, reusing step 6's Sphinx environment (it
#      re-reads no page, so executes none), and copies them into
#      _build/html/_notebooks/, which was made before step 6 so
#      the theme shows each page's "Download Notebook" button (the series
#      build the notebooks first; the order here keeps the HTML build the
#      one that executes, which step 7 counts);
#   9. for a site whose site.yml publishes a pdf, installs ImageMagick and
#      builds it the same way, with the pdflatex builder, strict, reusing the
#      same environment, and copies it into _build/html/_pdf/, also made
#      before step 6, so the theme shows the "Book (PDF)" link; then checks
#      the PDF the pages link to is there;
#   10. keeps the HTML (html-<key>, green builds only, 7 days) and the report
#      with the environment record (execution-status-<key>) as artefacts. A
#      failed build also uploads build-lectures' failure reports
#      (execution-reports-<key>): each failed page's traceback, from
#      _build/html/reports. It does not hold the site's execution cache,
#      which build-lectures looks for at _build/.jupyter_cache, not at the
#      site's path;
#   11. saves the execution cache (below) when the HTML build and the
#      report (which counts what it executed) succeeded, even if a later step
#      failed or the job was cancelled or timed out: the cache is the HTML
#      build's alone, so a failed notebooks or PDF build (a LaTeX error, an
#      apt mirror down while ImageMagick installs) does not throw a cold
#      build's execution away; and unstages the site.
#
# THE EXECUTION CACHE is actions/cache, one per site, at the path every
# site's _config.yml names, _build/jupyter_cache/<key> (pool-check rule 7).
# Its key is jb1-<key>-<tag><env hash>-<packages hash>-<image hash>-<run>:
#   - the tag: empty in the series environment, `base-` in the base one;
#   - the env hash: of mirror/<key>/environment.yml, whole, in the series
#     environment (as dp's own cache keys hash it); in the base one, of
#     _base/environment-update.yml's entries, its lines without comments or
#     blank lines, so editing a comment keeps the key;
#   - the hash of site.yml's extra_packages (tools/site-matrix);
#   - the image hash: in a container, of the image's
#     /etc/quantecon-container, which names the image and the time it was
#     built. The images are built only when their Dockerfiles change
#     (QuantEcon/actions, build-containers.yml, with no schedule), so a new
#     hash is a new image, not a rebuild of the same one. On the GPU leg, of
#     the RunsOn spec, which names the machine image by its AMI ID (an AMI
#     never changes), and of _base/environment.yml's entries, the base the
#     leg creates;
#   - and the run.
# A cache is never overwritten, so each save is a new key, and a restore
# takes the newest saved under the same tag and hashes; there is no fallback
# to another key's cache.
#   What the key catches: a change to the file it hashes (in the base
#   environment, to an entry of the list), to the site's extra_packages or
#   to the image starts an empty cache, so every page is executed again. In
#   the series environment the build never installs environment.yml (the
#   packages come from the image): the file only names the environment the
#   series declares, as in dp's own cache keys. In the base environment the
#   list it hashes is what the build installs.
#   What it does not catch: an extra package such as jax comes from the
#   newest release pip finds, so a new release keeps the key; and on the GPU
#   leg, the CUDA libraries jax[cuda13] brings are not pinned. A page is
#   executed again only when its own code changes (jupyter-cache matches a
#   page by its code cells) or the key does.
# Pull requests only restore. A save happens on main alone (a push, a manual
# run or the schedule), after an HTML build that succeeded and executed at
# least one page, and its execution report, whatever a later step did (step
# 11); a build that took every page from the cache has nothing new to save.
#
# COLD BUILDS: until a run on main has saved a cache under the current key,
# every build of a site executes every page (dp: about 50 pages, 20 to 40
# minutes on ubuntu-latest). So every pull request before this workflow's
# first run on main whose HTML build and report succeed builds cold, every
# time it runs, and so does every build after the key changes, until main
# saves again.
#
# SHOWING THE CACHE RESTORE (QuantEcon/project-monorepo#25 asks for it):
# a pull request never saves, so its own runs cannot show one. It is shown
# after the merge: the merge's push to main builds cold and saves, and then
# a manual run on main (or the schedule) restores that cache, which the run
# summary names and the execution report counts (every page cached, none
# executed).
#
# TRIGGERS: a push to main or a pull request that touches the pool, the sites,
# the tools a leg runs, what tools/sync reads, the environment list in
# _base/, and this file; a manual run;
# and twice a week on main, Monday and Thursday at 05:17 UTC, which keeps each
# site's cache in use (GitHub drops a cache not read for 7 days, after which
# every pull request would build cold). With every page in the cache, such a
# run executes nothing: it checks the current image's Sphinx stack and the
# pages' rendering, not their execution. sync.yml pushes its pin commits with
# GITHUB_TOKEN, which starts no run here. drift-check.yml's refresh pull
# request touches lectures/, so it is built like any other (its run waits for
# a maintainer's approval, as that workflow notes), and so is its merge.
#
# PREVIEWS (QuantEcon/project-monorepo#79): on a pull request, the third job
# deploys each site whose build kept its HTML to the site's own Cloudflare
# Pages project, qe-preview-<key>, at
# https://pr-<number>.qe-preview-<key>.pages.dev, with QuantEcon/actions'
# preview-cloudflare. The action comments on the pull request with the
# address and links to the changed pages the site's _toc.yml names, one
# comment per site (its comment-key and toc-file inputs). It is a job of its
# own, as the action's chapter advises: the build runs the lectures' code and
# holds no secret, and the job that holds the Cloudflare token runs none.
# GitHub has no needs: for one leg of a matrix, so it starts when every leg
# has finished, and a site's preview waits for the slowest site the change
# reaches. A site whose build failed keeps no HTML and gets no preview. The
# preview carries the HTML and the notebooks, not the PDF: Cloudflare takes
# no file over 25 MiB, and intermediate's PDF is 68 MiB. So a preview's
# "Book (PDF)" link answers 404, with a page the job writes to say why (and
# so does any address the preview lacks: with no 404.html, Cloudflare would
# answer every one with the home page); the strict PDF build is the pull request's
# check, and the html-<key> artefact holds the PDF (the owner's choice of
# 2026-11-28: the builds stay, the PDF stays out of the preview). A pull
# request from a fork, or by Dependabot, gets no secrets, so no preview, and
# the action says so in a notice. The token and the account's ID are the
# organisation's secrets CLOUDFLARE_PAGES_TOKEN and CLOUDFLARE_QE_ACCOUNT_ID,
# and the six projects were made on 2026-11-28, with no Git provider, so
# Cloudflare neither builds nor comments: a site added to SITES needs its
# project made first, with `wrangler pages project create qe-preview-<key>
# --production-branch main` (an AI agent running wrangler 4.130 or later
# adds --force, or wrangler makes a Workers project instead).
#
# WHAT IT DOES NOT DO (yet): publish.
# Later, in the second phase, after the cutovers (2026-11-27): build on
# mystmd (QuantEcon/actions#337), and share one execution cache between the
# sites of one environment (each site keeps its own until then).

on:
  push:
    branches: [main]
    paths:
      - 'lectures/**'
      - 'sites/**'
      - 'tools/sync'
      - 'tools/stage-site'
      - 'tools/site-matrix'
      - 'tools/execution-report'
      - 'tools/affected-sites'
      - 'sync/manifest.yml'
      - 'sync/state.yml'
      - '_base/**'
      - '.github/workflows/site-build.yml'
  # The same paths: keep the two lists in step.
  pull_request:
    paths:
      - 'lectures/**'
      - 'sites/**'
      - 'tools/sync'
      - 'tools/stage-site'
      - 'tools/site-matrix'
      - 'tools/execution-report'
      - 'tools/affected-sites'
      - 'sync/manifest.yml'
      - 'sync/state.yml'
      - '_base/**'
      - '.github/workflows/site-build.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1,4'

permissions:
  contents: read

# One group per branch or pull request. On a pull request a newer push cancels
# the build in progress (cancel-in-progress). On main a build in progress is
# never cancelled, since it saves the cache the pull requests restore. In
# either case GitHub keeps at most one run waiting per group, and a newer run
# cancels the one waiting, whatever cancel-in-progress says: of three quick
# pushes to main, the first builds, the second is cancelled while it waits,
# and the third builds when the first has finished. The third takes in the
# second's change, since a push is compared with the last build that
# succeeded, not with the commit before it.
concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The sites this workflow builds, by folder under sites/, separated by
  # spaces. A site is added when it is brought through
  # (QuantEcon/project-monorepo#77).
  SITES: dp intro advanced programming intermediate jax

defaults:
  run:
    shell: bash

jobs:
  sites:
    name: matrix
    runs-on: ubuntu-latest
    # actions: read lets a push find the last build on main that succeeded.
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # A push is compared with the head of the last build on main that
      # succeeded, not the commit before it: a run cancelled while it waits
      # (above) or by hand, or one that failed, leaves its change unbuilt,
      # and the next push takes it in. A green push, scheduled or manual
      # build leaves every site built green at its head or unchanged since an
      # earlier green build, so its head is a sound base. A pull request's
      # run never is, though a fork's branch may be called main. This step
      # alone holds the token, and runs no code from the change.
      - name: Find the last build on main that succeeded
        id: last
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/site-build.yml/runs"
          sha=$(gh api "$runs?branch=main&status=success&per_page=50" --jq \
            '[.workflow_runs[] | select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")][0].head_sha // empty') || sha=""
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "${sha:-none can be read}"

      # A pull request is compared with its base, a push with the build found
      # above. The schedule and a manual run take every site, and so does a
      # base that cannot be found or fetched. The diff is of two trees, so only
      # the base is fetched, with no history. --no-renames lists a renamed
      # file's old path as well as its new one, and -z keeps a name git
      # would otherwise quote. A change to the rule itself (the tool or this
      # workflow) builds every site without asking the tool.
      - name: Choose the sites the change reaches
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          LAST_GOOD: ${{ steps.last.outputs.sha }}
        run: |
          read -ra all <<< "$SITES"
          keys="${all[*]}"
          base=""
          case "$EVENT" in
            pull_request)
              base=$PR_BASE
              why="every site: the pull request has no base" ;;
            push)
              base=$LAST_GOOD
              why="every site: no build on main that succeeded can be read" ;;
            *)
              why="every site ($EVENT)" ;;
          esac
          if [ -n "$base" ]; then
            if ! git fetch --no-tags --depth=1 origin "$base"; then
              why="every site: the base ${base:0:7} cannot be fetched"
            else
              changed="$RUNNER_TEMP/changed-paths"
              git diff --no-renames --name-only -z "$base" HEAD > "$changed"
              n=$(tr -cd '\0' < "$changed" | wc -c | tr -d ' ')
              if grep -qzxF -e tools/affected-sites -e .github/workflows/site-build.yml "$changed"; then
                why="every site: the change, $n path(s) against ${base:0:7}, touches the rule itself"
              else
                keys=$(uv run --script tools/affected-sites -z --base "$base" "${all[@]}" < "$changed")
                why="the sites the change reaches, from $n changed path(s) against ${base:0:7}"
              fi
            fi
          fi
          echo "keys=$keys" >> "$GITHUB_OUTPUT"
          {
            echo "### Sites built"
            echo ""
            echo "${keys:-none}: $why."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${keys:-none}: $why"

      - name: Read each site's site.yml
        id: matrix
        env:
          KEYS: ${{ steps.affected.outputs.keys }}
        run: |
          read -ra keys <<< "$KEYS"
          if [ "${#keys[@]}" -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "No site is affected, so none is built."
            exit 0
          fi
          # The run's ID goes into a GPU site's RunsOn label.
          matrix=$(uv run --script tools/site-matrix --run-id "$GITHUB_RUN_ID" "${keys[@]}")
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  build:
    name: ${{ matrix.site.key }}
    needs: sites
    if: ${{ needs.sites.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.matrix) }}
    runs-on: ${{ matrix.site.runs_on }}
    timeout-minutes: ${{ matrix.site.timeout_minutes }}
    # A GPU site has no image: an empty container runs the job on the machine.
    container: ${{ matrix.site.image }}
    # packages: read pulls the container image, which is not public (above).
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The image's Python has PyYAML, tools/sync's one dependency, and git, so
      # the tools run with `python`, with no uv to install. tools/stage-site
      # needs PyYAML and myst-parser (with linkify-it-py) for --local-links
      # alone, which every leg's environment has, since Jupyter Book needs
      # them too, and tools/execution-report the standard library alone. From
      # the staging on, the tools run in a login shell, as build-lectures runs
      # jb: on the GPU machine only a login shell has the environment's
      # `python`.
      - name: Reconstruct the series' files at its pin
        if: ${{ matrix.site.environment == 'series' }}
        env:
          KEY: ${{ matrix.site.key }}
        run: python tools/sync "$KEY"

      # The base environment: the one package list, applied to the full
      # image's environment (setup-environment's container mode).
      - name: Apply the environment list
        if: ${{ matrix.site.leg == 'container' && matrix.site.environment == 'base' }}
        uses: quantecon/actions/setup-environment@v0
        with:
          environment-update: _base/environment-update.yml

      # The GPU leg (above): the base the full image carries, created as the
      # GPU series' own workflows create theirs. setup-miniconda activates it
      # in a login shell (bash -l), which every later step that needs it uses.
      - name: Create the base environment (GPU)
        if: ${{ matrix.site.leg == 'gpu' }}
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          auto-activate-base: true
          miniconda-version: 'latest'
          python-version: "3.13"
          environment-file: _base/environment.yml
          activate-environment: quantecon

      - name: Apply the environment list (GPU)
        if: ${{ matrix.site.leg == 'gpu' }}
        shell: bash -leo pipefail {0}
        run: conda env update -n quantecon -f _base/environment-update.yml

      # The list's jax is the CPU wheel; the [cuda13] extra at the same version
      # adds the CUDA plugin and the CUDA libraries it bundles, which need only
      # the machine's NVIDIA driver.
      - name: Install jax for CUDA, and check it finds the GPU
        if: ${{ matrix.site.leg == 'gpu' }}
        shell: bash -leo pipefail {0}
        run: |
          nvidia-smi
          version=$(sed -n 's/^ *- jax==\([^ ]*\).*/\1/p' _base/environment-update.yml)
          if [ -z "$version" ]; then
            echo "::error::_base/environment-update.yml pins no jax version"
            exit 1
          fi
          python -m pip install --no-input "jax[cuda13]==$version"
          python -c "import jax; d = jax.devices(); print('jax', jax.__version__, d); assert d[0].platform == 'gpu', d"

      # The full image runs as root; the series' own builds do not, and print
      # no root-user warning in their install cells.
      - name: Quiet pip's root-user warning
        if: ${{ matrix.site.leg == 'container' && matrix.site.environment == 'base' }}
        run: echo "PIP_ROOT_USER_ACTION=ignore" >> "$GITHUB_ENV"

      - name: Build matplotlib's font cache
        if: ${{ matrix.site.environment == 'base' }}
        shell: bash -leo pipefail {0}
        run: python -c "import matplotlib.font_manager"

      # site.yml's extra_packages, into the environment jb runs in: a login
      # shell, as build-lectures uses, so `python` is that environment's (and
      # -eo pipefail, which a custom shell does not get). pool-check and
      # tools/site-matrix allow only plain requirements (no space, none
      # starting with -), so no value is read as a pip option. pip's log names
      # the version it installed.
      - name: Install the site's extra packages
        if: ${{ join(matrix.site.extra_packages, ' ') != '' }}
        shell: bash -leo pipefail {0}
        env:
          EXTRA_PACKAGES: ${{ join(matrix.site.extra_packages, ' ') }}
        run: |
          read -ra packages <<< "$EXTRA_PACKAGES"
          python -m pip install --no-input --root-user-action=ignore "${packages[@]}"

      - name: Record the environment
        shell: bash -leo pipefail {0}
        run: |
          mkdir -p _build
          # pip list, not pip freeze: freeze gives a package conda installed
          # as `name @ file:///...`, with no version.
          python -m pip list --format=freeze > _build/pip-freeze.txt
          echo "$(wc -l < _build/pip-freeze.txt) packages; jupyter-book $(python -m pip show jupyter-book 2>/dev/null | sed -n 's/^Version: //p')"

      - name: Name the site's cache and its key
        id: site
        env:
          KEY: ${{ matrix.site.key }}
          LEG: ${{ matrix.site.leg }}
          ENVIRONMENT: ${{ matrix.site.environment }}
          MACHINE: ${{ matrix.site.machine }}
          ENV_FILE: ${{ matrix.site.env_file }}
          SERIES_ENV_HASH: ${{ hashFiles(matrix.site.env_file) }}
          TAG: ${{ matrix.site.cache_tag }}
          PACKAGES_HASH: ${{ matrix.site.packages_hash }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # A list's entries: its lines without comments (a # at the start of
          # a line or after a space) and blank lines, so a comment's edit
          # keeps the key.
          entries() { sed -E -e 's/(^|[[:space:]])#.*$//' -e 's/[[:space:]]+$//' -e '/^$/d' "$1"; }
          if [ ! -s "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE does not exist, so the cache has no key (in the series environment, tools/sync did not reconstruct it)"
            exit 1
          fi
          if [ "$ENVIRONMENT" = base ]; then
            # The list the leg applied, by its entries.
            ENV_HASH=$(entries "$ENV_FILE" | sha256sum | cut -c1-16)
          else
            # The series' environment.yml, whole, as dp's own cache keys hash it.
            ENV_HASH=$SERIES_ENV_HASH
          fi
          if [ "$LEG" = gpu ]; then
            # The GPU leg: the machine image, by its AMI ID in RunsOn's spec,
            # and the base environment the leg created on it.
            echo "  $MACHINE"
            IMAGE_HASH=$({ printf '%s\n' "$MACHINE"; entries _base/environment.yml; } | sha256sum | cut -c1-16)
          else
            # The image's own record of itself: its name and build time.
            if [ ! -s /etc/quantecon-container ]; then
              echo "::error::/etc/quantecon-container is missing, so the cache key cannot name the image"
              exit 1
            fi
            sed 's/^/  /' /etc/quantecon-container
            IMAGE_HASH=$(sha256sum /etc/quantecon-container | cut -c1-16)
          fi
          {
            echo "cache-path=_build/jupyter_cache/$KEY"
            echo "cache-prefix=jb1-$KEY-$TAG$ENV_HASH-$PACKAGES_HASH-$IMAGE_HASH-"
            echo "cache-key=jb1-$KEY-$TAG$ENV_HASH-$PACKAGES_HASH-$IMAGE_HASH-$RUN"
          } >> "$GITHUB_OUTPUT"

      # The primary key carries this run's ID, so it never matches: the
      # restore always takes the newest cache saved under the prefix.
      - name: Restore the site's execution cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.site.outputs.cache-path }}
          key: ${{ steps.site.outputs.cache-key }}
          restore-keys: ${{ steps.site.outputs.cache-prefix }}

      - name: Report the cache restored
        env:
          KEY: ${{ matrix.site.key }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
          PREFIX: ${{ steps.site.outputs.cache-prefix }}
        run: |
          if [ -n "$MATCHED" ]; then
            line="Execution cache restored: \`$MATCHED\`."
          else
            line="No execution cache under \`$PREFIX\`: every page is executed."
          fi
          echo "$line"
          printf '### Site %s\n\n%s\n\n' "\`$KEY\`" "$line" >> "$GITHUB_STEP_SUMMARY"

      # Its pages, its files, its _config.yml and its _toc.yml, into lectures/;
      # with site.yml's local_links (a consumer site), its links to lectures it
      # carries made links within it (tools/stage-site --local-links).
      - name: Stage the site
        id: stage
        env:
          KEY: ${{ matrix.site.key }}
          LOCAL_LINKS: ${{ matrix.site.local_links }}
        shell: bash -l {0}
        run: |
          if [ "$LOCAL_LINKS" = true ]; then
            python tools/stage-site --local-links "$KEY"
          else
            python tools/stage-site "$KEY"
          fi

      - name: Note the build's start
        id: start
        run: echo "since=$(date +%s)" >> "$GITHUB_OUTPUT"

      # A site that publishes notebooks or a PDF (site.yml's publishes) gets
      # the theme's "Download Notebook" button and its "Book (PDF)" link,
      # which quantecon-book-theme shows on a page when _build/html/_notebooks/
      # or _build/html/_pdf/ is a folder as it renders it. The series build
      # the PDF and the notebooks first and copy them in; here the folders are
      # made first, the HTML is built, and the notebooks and the PDF are built
      # and copied in after (below). So the HTML build stays the one that
      # executes the pages, which the execution report counts and the cache
      # save needs.
      - name: Make room for the site's downloads
        if: ${{ contains(matrix.site.publishes, 'notebooks') || contains(matrix.site.publishes, 'pdf') }}
        env:
          NOTEBOOKS: ${{ contains(matrix.site.publishes, 'notebooks') }}
          PDF: ${{ contains(matrix.site.publishes, 'pdf') }}
        run: |
          if [ "$NOTEBOOKS" = true ]; then mkdir -p _build/html/_notebooks; fi
          if [ "$PDF" = true ]; then mkdir -p _build/html/_pdf; fi

      # With the site staged, lectures/ holds its _config.yml and _toc.yml, so
      # jb needs no --config or --toc. extra-args replaces build-lectures'
      # default, so it keeps -W; nitpick adds -n.
      - name: Build the site's HTML (strict)
        id: build
        uses: quantecon/actions/build-lectures@v0
        with:
          builder: html
          source-dir: lectures
          extra-args: -W --keep-going
          upload-failure-reports: true
          failure-artifact-name: execution-reports-${{ matrix.site.key }}

      # A login shell, as build-lectures runs jb, so this is the Python that
      # ran the build: the report unpickles Sphinx's environment.
      - name: Write the execution report
        id: report
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        shell: bash -l {0}
        env:
          KEY: ${{ matrix.site.key }}
          SINCE: ${{ steps.start.outputs.since }}
        run: python tools/execution-report --site "$KEY" --since "$SINCE" --out _build/execution_status.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the execution report
        if: ${{ !cancelled() && steps.report.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: execution-status-${{ matrix.site.key }}
          path: |
            _build/execution_status.json
            _build/pip-freeze.txt
          if-no-files-found: warn

      # After the execution report, which reads the environment this build
      # rewrites. It reuses the HTML build's Sphinx environment ("0 added, 0
      # changed, 0 removed"), so it re-reads and executes no page.
      - name: Build the site's notebooks (strict)
        id: notebooks
        if: ${{ contains(matrix.site.publishes, 'notebooks') }}
        uses: quantecon/actions/build-lectures@v0
        with:
          builder: jupyter
          source-dir: lectures
          extra-args: -W --keep-going
          upload-failure-reports: true
          failure-artifact-name: execution-reports-${{ matrix.site.key }}-notebooks

      # As build-lectures' html-copy-notebooks copies them: each notebook under
      # _build/jupyter at the same path under _build/html/_notebooks/.
      - name: Copy the notebooks into the site
        if: ${{ steps.notebooks.outcome == 'success' }}
        run: |
          n=0
          while IFS= read -r -d '' nb; do
            rel=${nb#_build/jupyter/}
            mkdir -p "_build/html/_notebooks/$(dirname "$rel")"
            cp "$nb" "_build/html/_notebooks/$rel"
            n=$((n + 1))
          done < <(find _build/jupyter -name '*.ipynb' -print0)
          if [ "$n" -eq 0 ]; then
            echo "::error::the jupyter build wrote no notebooks under _build/jupyter"
            exit 1
          fi
          echo "$n notebooks copied into _build/html/_notebooks/"

      # The PDF, as the series build theirs (pdflatex builder, -n -W), reusing
      # the HTML build's Sphinx environment, so it re-reads and executes no
      # page. LaTeX comes with the full image and with the GPU machine image,
      # as the GPU series' own PDF builds use it.
      # Jupyter Book's PDF build turns on sphinx.ext.imgconverter, which runs
      # ImageMagick's `convert` on an image LaTeX can't take, an SVG or a GIF:
      # today the remote SVG logo that MyST's html_image makes an image of on
      # three of jax's pages, without which the strict build fails on "Unable
      # to run the image conversion command". Neither the full image nor the
      # GPU machine image has it, so every leg that builds a PDF installs it,
      # as lecture-jax's workflows do: as root in a container, with sudo on
      # the GPU machine.
      - name: Install ImageMagick for the PDF
        if: ${{ contains(matrix.site.publishes, 'pdf') }}
        run: |
          if ! command -v convert >/dev/null; then
            sudo=""
            if [ "$(id -u)" -ne 0 ]; then sudo=sudo; fi
            $sudo apt-get -o DPkg::Lock::Timeout=600 update
            $sudo apt-get -o DPkg::Lock::Timeout=600 install -y imagemagick
          fi
          convert -version | sed -n 1p

      - name: Build the site's PDF (strict)
        id: pdf
        if: ${{ contains(matrix.site.publishes, 'pdf') }}
        uses: quantecon/actions/build-lectures@v0
        with:
          builder: pdflatex
          source-dir: lectures
          extra-args: -W --keep-going
          upload-failure-reports: true
          failure-artifact-name: execution-reports-${{ matrix.site.key }}-pdf

      # As the series copy theirs (cp _build/latex/*.pdf _build/html/_pdf).
      # The theme links each page to /_pdf/<latex targetname>.pdf, so every
      # such link the pages carry is checked against the files copied. The
      # link is from the domain's root: right for the five PDF sites, which
      # are served at their domain's root, but a PDF site served under a path
      # (as dp is, which publishes none) would pass this check and 404.
      - name: Copy the PDF into the site
        if: ${{ steps.pdf.outcome == 'success' }}
        run: |
          shopt -s nullglob
          pdfs=(_build/latex/*.pdf)
          if [ "${#pdfs[@]}" -eq 0 ]; then
            echo "::error::the pdflatex build wrote no PDF under _build/latex"
            exit 1
          fi
          cp "${pdfs[@]}" _build/html/_pdf/
          # grep finding nothing (1) is checked below; a real error (2) fails here.
          links=$({ grep -rhoE 'href="/_pdf/[^"]+\.pdf"' --include='*.html' _build/html || [ $? -eq 1 ]; } | sed -e 's#^href="/##' -e 's#"$##' | sort -u)
          if [ -z "$links" ]; then
            echo "::error::no page links to a PDF under /_pdf/, so the theme did not see _build/html/_pdf/"
            exit 1
          fi
          while IFS= read -r link; do
            if [ ! -f "_build/html/$link" ]; then
              echo "::error::the pages link to /$link, which the build did not make (it made: ${pdfs[*]})"
              exit 1
            fi
          done <<< "$links"
          echo "${#pdfs[@]} PDF(s) copied into _build/html/_pdf/; the pages link to /$(paste -sd ' ' - <<< "$links")"

      - name: Keep the site's HTML
        uses: actions/upload-artifact@v4
        with:
          name: html-${{ matrix.site.key }}
          path: _build/html
          retention-days: 7

      - name: Save the execution cache
        if: ${{ always() && steps.build.outcome == 'success' && steps.report.outcome == 'success' && github.ref == 'refs/heads/main' && steps.report.outputs.executed != '0' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.site.outputs.cache-path }}
          key: ${{ steps.site.outputs.cache-key }}

      - name: Unstage the site
        if: ${{ always() && steps.stage.outcome != 'skipped' }}
        env:
          KEY: ${{ matrix.site.key }}
        shell: bash -l {0}
        run: python tools/stage-site --clean "$KEY"

  # PREVIEWS (above): a pull request's sites, each from its build's HTML.
  # After every leg, green or not (!cancelled()), so that one site's failure
  # does not stop another's preview; each leg checks its own site's HTML.
  preview:
    name: preview ${{ matrix.site.key }}
    needs: [sites, build]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.sites.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read finds the site's HTML among the run's artefacts;
    # pull-requests: write posts the preview's comment.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # The build keeps html-<key> only when every step before it succeeded.
      - name: Find the site's HTML
        id: html
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ matrix.site.key }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=html-$KEY" --jq '.total_count')
          if [ "$n" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No preview of $KEY: its build kept no HTML, so it failed or was cancelled."
          fi

      # For toc-file and the changed pages: the pull request's merge commit.
      # A public repository's history is fetched with no credentials.
      - name: Checkout
        if: ${{ steps.html.outputs.found == 'true' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The wrangler preview-cloudflare pins needs Node 22.12 or later.
      - name: Set up Node
        if: ${{ steps.html.outputs.found == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download the site's HTML
        if: ${{ steps.html.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: html-${{ matrix.site.key }}
          path: _build/html

      # Cloudflare Pages takes no file over 25 MiB, and the PDFs are up to
      # 68 MiB, so the preview leaves _pdf/ out (PREVIEWS, above). Any other
      # file that large is named here, before the deploy. A site with no
      # 404.html at its root is served as a single-page app, every unknown
      # address answering 200 with the root page, so a link the preview
      # cannot follow would land on the home page; the build makes none, so
      # this writes one, and such a link answers 404.
      - name: Leave the PDF out
        if: ${{ steps.html.outputs.found == 'true' }}
        run: |
          rm -rf _build/html/_pdf
          if [ ! -e _build/html/404.html ]; then
            cat > _build/html/404.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8"><title>Not in this preview</title></head>
          <body><h1>Not in this preview</h1>
          <p>This pull request's preview has no page or file at this address. A preview leaves out the site's PDF, so the "Book (PDF)" link ends here: the PDF is in the build's <code>html-&lt;site&gt;</code> artefact. See CONTRIBUTING.md in QuantEcon/lectures.</p>
          </body></html>
          HTML
          fi
          big=$(find _build/html -type f -size +25M | sed 's#^_build/html/##' | paste -sd ' ' -)
          if [ -n "$big" ]; then
            echo "::error::Cloudflare Pages takes no file over 25 MiB, and the preview holds: $big"
            exit 1
          fi
          echo "The preview holds $(find _build/html -type f | wc -l) files, $(du -sh _build/html | cut -f1)."

      # comment-key and toc-file are on QuantEcon/actions' main and not yet in
      # a release (QuantEcon/actions#336), so this names main's commit until
      # v0 carries them.
      - name: Deploy the preview
        id: preview
        if: ${{ steps.html.outputs.found == 'true' }}
        uses: quantecon/actions/preview-cloudflare@bb4ef180b429d318894b375cff186c6a80fcb281
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_QE_ACCOUNT_ID }}
          project-name: qe-preview-${{ matrix.site.key }}
          build-dir: _build/html
          lectures-dir: lectures
          toc-file: sites/${{ matrix.site.key }}/_toc.yml
          comment-key: ${{ matrix.site.key }}
