name: site-build

# Build the published sites from the pool, one leg per site, on Jupyter Book 1
# (QuantEcon/project-monorepo#77; dp first, QuantEcon/project-monorepo#25).
# Nothing here publishes: the build is checked, and its HTML and execution
# report are kept as artefacts. Publishing is its own item
# (QuantEcon/project-monorepo#78, rehearsed in QuantEcon/project-monorepo#27),
# and each series keeps building and publishing from its own repository until
# its cutover.
#
# WHICH SITES: the ones named in SITES below, today `dp`, `intro`, `advanced`
# and `programming`. The other two folders in sites/ are not built until their
# turn, so a pull request is never held up by a site that has not been brought
# through yet. The first job reads each named site's sites/<key>/site.yml
# (tools/site-matrix) and hands the matrix to the second: the runner class
# gives runs-on, the environment (below) the container and the file the cache
# key hashes, the job's time limit is site.yml's cell_timeout plus an
# allowance for a build from an empty cache (site.yml holds no job limit;
# tools/site-matrix says why), and extra_packages lists what the leg installs.
# The ubuntu-latest class builds in a container, the GPU class (g4dn.2xlarge)
# on a RunsOn machine with no container (THE GPU LEG, below).
# `fail-fast: false`, so one site's failure never stops another's build. Every
# push or pull request that touches lectures/ or sites/ builds every named
# site, whatever it changed: no site is skipped yet because its toc does not
# reach the change.
#
# THE ENVIRONMENT is site.yml's optional `environment` (sites/README.md):
#   series (the default; dp): ghcr.io/quantecon/quantecon-build:latest, the
#     lean image dp's own workflows build in, with nothing installed but
#     site.yml's extra_packages. dp stays here until its first shadow
#     comparison, so that comparison measures the move of the build alone
#     (QuantEcon/project-monorepo ideas/one-environment-for-every-site.md).
#   base (intro, advanced; programming on the GPU leg, below): in a
#     container, ghcr.io/quantecon/quantecon:latest, the full image, whose
#     anaconda=2026.07 is what every series' environment.yml names, with
#     _base/environment-update.yml, the one package list every site is to
#     build with, applied by QuantEcon/actions' setup-environment (conda env
#     update in the image's environment). The image runs as root, so the
#     container leg sets PIP_ROOT_USER_ACTION=ignore: without it every install
#     cell's output carries pip's root-user warning, which the series' own
#     builds (not root) do not print. It also builds matplotlib's font cache
#     before the build, so no lecture's first plot prints that it is building
#     it.
#
# THE GPU LEG (the g4dn.2xlarge class; programming so far) runs on a RunsOn
# machine with one NVIDIA T4, from QuantEcon's GPU machine image (its AMI ID
# is in tools/site-matrix), with no container, and in the base environment
# alone. It builds the same environment as the container's: setup-miniconda
# creates _base/environment.yml (Python 3.13 and anaconda=2026.07, what the
# full image carries), as the GPU series' own workflows create theirs;
# `conda env update` applies _base/environment-update.yml to it
# (setup-environment would update the machine image's own environment, which
# has no anaconda); and jax[cuda13], at the list's jax version, adds the CUDA
# plugin, with a check that jax finds the GPU. The owner chose this shape on
# 2026-11-22, after the environment scan of 2026-11-19 built the three GPU
# sites so with nothing new (QuantEcon/project-monorepo#77).
#
# Neither image is public: the build job pulls with its GITHUB_TOKEN, so it
# has `packages: read`, and each package's Actions access list (Manage
# Actions access, in the QuantEcon organisation's package settings) must
# include QuantEcon/lectures, which nothing here can check. Without that, the
# job fails in "Initialize containers" with unauthorized.
#
# EACH LEG, in its container or on its machine:
#   1. checks out with full history (the theme dates each page from git log);
#   2. in the series environment, reconstructs mirror/<key>/ at its pin
#      (tools/sync <key>: a sparse, shallow fetch of the series' lectures/
#      and environment.yml, a few seconds), for the one file the cache key
#      needs, environment.yml; in the base environment, applies
#      _base/environment-update.yml instead (on the GPU leg, creates the base
#      first and adds jax for CUDA after: above), and builds the font cache;
#   3. installs site.yml's extra_packages, if it has any, with pip into the
#      environment jb runs in. dp's is jax, the CPU wheel: the
#      image has none, and mccall_risk imports it without installing it.
#      Then it records the environment as installed (pip freeze), which the
#      execution report's artefact keeps;
#   4. restores the site's execution cache (below);
#   5. stages the site into lectures/ (tools/stage-site): its own pages and
#      files, and its _config.yml and _toc.yml, where `jb build lectures`
#      finds them with no --config or --toc, and where build-lectures' check
#      of the executed notebooks reads the configuration;
#   6. builds HTML with QuantEcon/actions' build-lectures, `jb build lectures`,
#      strict: `-n -W --keep-going`, so a warning, a cell that raises, an
#      unresolved reference or a label two selected lectures both define
#      fails the build, and every failure is listed, not only the first.
#      The configuration's paths resolve as from the site's own folder: the
#      branding and the bibliography against lectures/, the execution cache
#      against the directory jb runs in, the repository's root;
#   7. writes execution_status.json (tools/execution-report): one row per page
#      executed or taken from the cache, with status, seconds, kernel and
#      which of the two; it runs after a failed build too;
#   8. keeps the HTML (html-<key>, green builds only, 7 days) and the report
#      with the environment record (execution-status-<key>) as artefacts. A
#      failed build also uploads build-lectures' failure reports
#      (execution-reports-<key>): each failed page's traceback, from
#      _build/html/reports. It does not hold the site's execution cache,
#      which build-lectures looks for at _build/.jupyter_cache, not at the
#      site's path;
#   9. saves the execution cache (below), and unstages the site.
#
# THE EXECUTION CACHE is actions/cache, one per site, at the path every
# site's _config.yml names, _build/jupyter_cache/<key> (pool-check rule 7).
# Its key is jb1-<key>-<tag><env hash>-<packages hash>-<image hash>-<run>:
#   - the tag: empty in the series environment, `base-` in the base one;
#   - the env hash: of mirror/<key>/environment.yml in the series
#     environment, of _base/environment-update.yml in the base one;
#   - the hash of site.yml's extra_packages (tools/site-matrix);
#   - the image hash: in a container, of the image's
#     /etc/quantecon-container, which names the image and the time it was
#     built. The images are built only when their Dockerfiles change
#     (QuantEcon/actions, build-containers.yml, with no schedule), so a new
#     hash is a new image, not a rebuild of the same one. On the GPU leg, of
#     the RunsOn spec, which names the machine image by its AMI ID (an AMI
#     never changes), and of _base/environment.yml, the base the leg creates;
#   - and the run.
# A cache is never overwritten, so each save is a new key, and a restore
# takes the newest saved under the same tag and hashes; there is no fallback
# to another key's cache.
#   What the key catches: a change to the file it hashes, to the site's
#   extra_packages or to the image starts an empty cache, so every page is
#   executed again. In the series environment the build never installs
#   environment.yml (the packages come from the image): the file only names
#   the environment the series declares, as in dp's own cache keys. In the
#   base environment the list it hashes is what the build installs.
#   What it does not catch: an extra package such as jax comes from the
#   newest release pip finds, so a new release keeps the key; and on the GPU
#   leg, the CUDA libraries jax[cuda13] brings are not pinned. A page is
#   executed again only when its own code changes (jupyter-cache matches a
#   page by its code cells) or the key does.
# Pull requests only restore. A save happens on main alone (a push, a manual
# run or the schedule), after a green build that executed at least one page;
# a build that took every page from the cache has nothing new to save.
#
# COLD BUILDS: until a run on main has saved a cache under the current key,
# every build of a site executes every page (dp: about 50 pages, 20 to 40
# minutes on ubuntu-latest). So every pull request before this workflow's
# first green run on main builds cold, every time it runs, and so does every
# build after the key changes, until main saves again.
#
# SHOWING THE CACHE RESTORE (QuantEcon/project-monorepo#25 asks for it):
# a pull request never saves, so its own runs cannot show one. It is shown
# after the merge: the merge's push to main builds cold and saves, and then
# a manual run on main (or the schedule) restores that cache, which the run
# summary names and the execution report counts (every page cached, none
# executed).
#
# TRIGGERS: a push to main or a pull request that touches the pool, the sites,
# the tools a leg runs, what tools/sync reads, the environment list in
# _base/, and this file; a manual run;
# and twice a week on main, Monday and Thursday at 05:17 UTC, which keeps each
# site's cache in use (GitHub drops a cache not read for 7 days, after which
# every pull request would build cold). With every page in the cache, such a
# run executes nothing: it checks the current image's Sphinx stack and the
# pages' rendering, not their execution. sync.yml pushes its pin commits with
# GITHUB_TOKEN, which starts no run here. drift-check.yml's refresh pull
# request touches lectures/, so it is built like any other (its run waits for
# a maintainer's approval, as that workflow notes), and so is its merge.
#
# WHAT IT DOES NOT DO (yet): publish; build the PDF or the notebooks (HTML
# alone for now); post a preview (QuantEcon/actions#336); build on mystmd
# (QuantEcon/actions#337); build only the sites whose toc lists a changed
# file; share one execution cache between the sites of one environment.

on:
  push:
    branches: [main]
    paths:
      - 'lectures/**'
      - 'sites/**'
      - 'tools/sync'
      - 'tools/stage-site'
      - 'tools/site-matrix'
      - 'tools/execution-report'
      - 'sync/manifest.yml'
      - 'sync/state.yml'
      - '_base/**'
      - '.github/workflows/site-build.yml'
  # The same paths: keep the two lists in step.
  pull_request:
    paths:
      - 'lectures/**'
      - 'sites/**'
      - 'tools/sync'
      - 'tools/stage-site'
      - 'tools/site-matrix'
      - 'tools/execution-report'
      - 'sync/manifest.yml'
      - 'sync/state.yml'
      - '_base/**'
      - '.github/workflows/site-build.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1,4'

permissions:
  contents: read

# One group per branch or pull request. On a pull request a newer push cancels
# the build in progress (cancel-in-progress). On main a build in progress is
# never cancelled, since it saves the cache the pull requests restore. In
# either case GitHub keeps at most one run waiting per group, and a newer run
# cancels the one waiting, whatever cancel-in-progress says: of three quick
# pushes to main, the first builds, the second is cancelled while it waits,
# and the third builds when the first has finished.
concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The sites this workflow builds, by folder under sites/, separated by
  # spaces. A site is added when it is brought through
  # (QuantEcon/project-monorepo#77).
  SITES: dp intro advanced programming

defaults:
  run:
    shell: bash

jobs:
  sites:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Read each site's site.yml
        id: matrix
        run: |
          read -ra keys <<< "$SITES"
          # The run's ID goes into a GPU site's RunsOn label.
          matrix=$(uv run --script tools/site-matrix --run-id "$GITHUB_RUN_ID" "${keys[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  build:
    name: ${{ matrix.site.key }}
    needs: sites
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.matrix) }}
    runs-on: ${{ matrix.site.runs_on }}
    timeout-minutes: ${{ matrix.site.timeout_minutes }}
    # A GPU site has no image: an empty container runs the job on the machine.
    container: ${{ matrix.site.image }}
    # packages: read pulls the container image, which is not public (above).
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The image's Python has PyYAML, tools/sync's one dependency, and git, so
      # the tools run with `python`, with no uv to install. tools/stage-site
      # and tools/execution-report need the standard library alone. From the
      # staging on, the tools run in a login shell, as build-lectures runs jb:
      # on the GPU machine only a login shell has the environment's `python`.
      - name: Reconstruct the series' files at its pin
        if: ${{ matrix.site.environment == 'series' }}
        env:
          KEY: ${{ matrix.site.key }}
        run: python tools/sync "$KEY"

      # The base environment: the one package list, applied to the full
      # image's environment (setup-environment's container mode).
      - name: Apply the environment list
        if: ${{ matrix.site.leg == 'container' && matrix.site.environment == 'base' }}
        uses: quantecon/actions/setup-environment@v0
        with:
          environment-update: _base/environment-update.yml

      # The GPU leg (above): the base the full image carries, created as the
      # GPU series' own workflows create theirs. setup-miniconda activates it
      # in a login shell (bash -l), which every later step that needs it uses.
      - name: Create the base environment (GPU)
        if: ${{ matrix.site.leg == 'gpu' }}
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          auto-activate-base: true
          miniconda-version: 'latest'
          python-version: "3.13"
          environment-file: _base/environment.yml
          activate-environment: quantecon

      - name: Apply the environment list (GPU)
        if: ${{ matrix.site.leg == 'gpu' }}
        shell: bash -leo pipefail {0}
        run: conda env update -n quantecon -f _base/environment-update.yml

      # The list's jax is the CPU wheel; the [cuda13] extra at the same version
      # adds the CUDA plugin and the CUDA libraries it bundles, which need only
      # the machine's NVIDIA driver.
      - name: Install jax for CUDA, and check it finds the GPU
        if: ${{ matrix.site.leg == 'gpu' }}
        shell: bash -leo pipefail {0}
        run: |
          nvidia-smi
          version=$(sed -n 's/^ *- jax==\([^ ]*\).*/\1/p' _base/environment-update.yml)
          if [ -z "$version" ]; then
            echo "::error::_base/environment-update.yml pins no jax version"
            exit 1
          fi
          python -m pip install --no-input "jax[cuda13]==$version"
          python -c "import jax; d = jax.devices(); print('jax', jax.__version__, d); assert d[0].platform == 'gpu', d"

      # The full image runs as root; the series' own builds do not, and print
      # no root-user warning in their install cells.
      - name: Quiet pip's root-user warning
        if: ${{ matrix.site.leg == 'container' && matrix.site.environment == 'base' }}
        run: echo "PIP_ROOT_USER_ACTION=ignore" >> "$GITHUB_ENV"

      - name: Build matplotlib's font cache
        if: ${{ matrix.site.environment == 'base' }}
        shell: bash -leo pipefail {0}
        run: python -c "import matplotlib.font_manager"

      # site.yml's extra_packages, into the environment jb runs in: a login
      # shell, as build-lectures uses, so `python` is that environment's (and
      # -eo pipefail, which a custom shell does not get). pool-check and
      # tools/site-matrix allow only plain requirements (no space, none
      # starting with -), so no value is read as a pip option. pip's log names
      # the version it installed.
      - name: Install the site's extra packages
        if: ${{ join(matrix.site.extra_packages, ' ') != '' }}
        shell: bash -leo pipefail {0}
        env:
          EXTRA_PACKAGES: ${{ join(matrix.site.extra_packages, ' ') }}
        run: |
          read -ra packages <<< "$EXTRA_PACKAGES"
          python -m pip install --no-input --root-user-action=ignore "${packages[@]}"

      - name: Record the environment
        shell: bash -leo pipefail {0}
        run: |
          mkdir -p _build
          # pip list, not pip freeze: freeze gives a package conda installed
          # as `name @ file:///...`, with no version.
          python -m pip list --format=freeze > _build/pip-freeze.txt
          echo "$(wc -l < _build/pip-freeze.txt) packages; jupyter-book $(python -m pip show jupyter-book 2>/dev/null | sed -n 's/^Version: //p')"

      - name: Name the site's cache and its key
        id: site
        env:
          KEY: ${{ matrix.site.key }}
          LEG: ${{ matrix.site.leg }}
          MACHINE: ${{ matrix.site.machine }}
          ENV_FILE: ${{ matrix.site.env_file }}
          ENV_HASH: ${{ hashFiles(matrix.site.env_file) }}
          TAG: ${{ matrix.site.cache_tag }}
          PACKAGES_HASH: ${{ matrix.site.packages_hash }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$ENV_HASH" ]; then
            echo "::error::$ENV_FILE does not exist, so the cache has no key (in the series environment, tools/sync did not reconstruct it)"
            exit 1
          fi
          if [ "$LEG" = gpu ]; then
            # The GPU leg: the machine image, by its AMI ID in RunsOn's spec,
            # and the base environment the leg created on it.
            echo "  $MACHINE"
            IMAGE_HASH=$({ printf '%s\n' "$MACHINE"; cat _base/environment.yml; } | sha256sum | cut -c1-16)
          else
            # The image's own record of itself: its name and build time.
            if [ ! -s /etc/quantecon-container ]; then
              echo "::error::/etc/quantecon-container is missing, so the cache key cannot name the image"
              exit 1
            fi
            sed 's/^/  /' /etc/quantecon-container
            IMAGE_HASH=$(sha256sum /etc/quantecon-container | cut -c1-16)
          fi
          {
            echo "cache-path=_build/jupyter_cache/$KEY"
            echo "cache-prefix=jb1-$KEY-$TAG$ENV_HASH-$PACKAGES_HASH-$IMAGE_HASH-"
            echo "cache-key=jb1-$KEY-$TAG$ENV_HASH-$PACKAGES_HASH-$IMAGE_HASH-$RUN"
          } >> "$GITHUB_OUTPUT"

      # The primary key carries this run's ID, so it never matches: the
      # restore always takes the newest cache saved under the prefix.
      - name: Restore the site's execution cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.site.outputs.cache-path }}
          key: ${{ steps.site.outputs.cache-key }}
          restore-keys: ${{ steps.site.outputs.cache-prefix }}

      - name: Report the cache restored
        env:
          KEY: ${{ matrix.site.key }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
          PREFIX: ${{ steps.site.outputs.cache-prefix }}
        run: |
          if [ -n "$MATCHED" ]; then
            line="Execution cache restored: \`$MATCHED\`."
          else
            line="No execution cache under \`$PREFIX\`: every page is executed."
          fi
          echo "$line"
          printf '### Site %s\n\n%s\n\n' "\`$KEY\`" "$line" >> "$GITHUB_STEP_SUMMARY"

      # Its pages, its files, its _config.yml and its _toc.yml, into lectures/.
      - name: Stage the site
        id: stage
        env:
          KEY: ${{ matrix.site.key }}
        shell: bash -l {0}
        run: python tools/stage-site "$KEY"

      - name: Note the build's start
        id: start
        run: echo "since=$(date +%s)" >> "$GITHUB_OUTPUT"

      # With the site staged, lectures/ holds its _config.yml and _toc.yml, so
      # jb needs no --config or --toc. extra-args replaces build-lectures'
      # default, so it keeps -W; nitpick adds -n.
      - name: Build the site's HTML (strict)
        id: build
        uses: quantecon/actions/build-lectures@v0
        with:
          builder: html
          source-dir: lectures
          extra-args: -W --keep-going
          upload-failure-reports: true
          failure-artifact-name: execution-reports-${{ matrix.site.key }}

      # A login shell, as build-lectures runs jb, so this is the Python that
      # ran the build: the report unpickles Sphinx's environment.
      - name: Write the execution report
        id: report
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        shell: bash -l {0}
        env:
          KEY: ${{ matrix.site.key }}
          SINCE: ${{ steps.start.outputs.since }}
        run: python tools/execution-report --site "$KEY" --since "$SINCE" --out _build/execution_status.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the execution report
        if: ${{ !cancelled() && steps.report.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: execution-status-${{ matrix.site.key }}
          path: |
            _build/execution_status.json
            _build/pip-freeze.txt
          if-no-files-found: warn

      - name: Keep the site's HTML
        uses: actions/upload-artifact@v4
        with:
          name: html-${{ matrix.site.key }}
          path: _build/html
          retention-days: 7

      - name: Save the execution cache
        if: success() && github.ref == 'refs/heads/main' && steps.report.outputs.executed != '0'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.site.outputs.cache-path }}
          key: ${{ steps.site.outputs.cache-key }}

      - name: Unstage the site
        if: ${{ always() && steps.stage.outcome != 'skipped' }}
        env:
          KEY: ${{ matrix.site.key }}
        shell: bash -l {0}
        run: python tools/stage-site --clean "$KEY"
