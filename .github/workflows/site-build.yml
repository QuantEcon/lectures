name: site-build

# Build the published sites from the pool, one leg per site, on Jupyter Book 1
# (QuantEcon/project-monorepo#77; dp first, QuantEcon/project-monorepo#25).
# Nothing here publishes: the build is checked, and its HTML and execution
# report are kept as artefacts. Publishing is its own item
# (QuantEcon/project-monorepo#78, rehearsed in QuantEcon/project-monorepo#27),
# and each series keeps building and publishing from its own repository until
# its cutover.
#
# WHICH SITES: the ones named in SITES below, today `dp` alone. The other five
# folders in sites/ are not built until their turn, so a pull request is never
# held up by a site that has not been brought through yet. The first job reads
# each named site's sites/<key>/site.yml (tools/site-matrix) and hands the
# matrix to the second: the runner class gives runs-on and the container, and
# the job's time limit is site.yml's cell_timeout plus an allowance for a
# build from an empty cache (site.yml holds no job limit; tools/site-matrix
# says why). Only an ubuntu-latest series site has a leg so far, in the
# container dp's own workflows build in; a GPU site is refused until its leg
# is written. `fail-fast: false`, so one site's failure never stops another's
# build.
#
# EACH LEG, in the container:
#   1. checks out with full history (the theme dates each page from git log);
#   2. reconstructs mirror/<key>/ at its pin (tools/sync <key>: a sparse,
#      shallow fetch of the series' lectures/ and environment.yml, a few
#      seconds), for the one file the cache key needs, environment.yml;
#   3. restores the site's execution cache (below);
#   4. stages the site into lectures/ (tools/stage-site): its own pages and
#      files, and its _config.yml and _toc.yml, where `jb build lectures`
#      finds them with no --config or --toc, and where build-lectures' check
#      of the executed notebooks reads the configuration;
#   5. builds HTML with QuantEcon/actions' build-lectures, `jb build lectures`,
#      strict: `-n -W --keep-going`, so a warning, a cell that raises, an
#      unresolved reference or a label two selected lectures both define
#      fails the build, and every failure is listed, not only the first.
#      The configuration's paths resolve as from the site's own folder: the
#      branding and the bibliography against lectures/, the execution cache
#      against the directory jb runs in, the repository's root;
#   6. writes execution_status.json (tools/execution-report): one row per page
#      executed or taken from the cache, with status, seconds, kernel and
#      which of the two; it runs after a failed build too;
#   7. keeps the HTML (html-<key>, green builds only, 7 days) and the report
#      (execution-status-<key>) as artefacts; a failed build also uploads
#      build-lectures' failure reports (execution-reports-<key>);
#   8. saves the execution cache (below), and unstages the site.
#
# THE EXECUTION CACHE is actions/cache, one per site, at the path every
# site's _config.yml names, _build/jupyter_cache/<key> (pool-check rule 7).
# Its key is jb1-<key>-<hash of mirror/<key>/environment.yml>-<run>: a cache
# is never overwritten, so each save is a new key, and a restore takes the
# newest saved under jb1-<key>-<env hash>-. There is no fallback across
# environments: a changed environment.yml starts from an empty cache rather
# than reuse outputs that other packages produced. Pull requests only restore.
# A save happens on main alone (a push, a manual run or the schedule), after
# a green build that executed at least one page; a build that took every page
# from the cache has nothing new to save. The container is
# quantecon-build:latest, as in dp's own workflows, whose cache is keyed the
# same way, on environment.yml, so a new image does not empty the cache.
#
# TRIGGERS: a push to main or a pull request that touches the pool, the sites,
# the tools a leg runs or what tools/sync reads, and this file; a manual run;
# and twice a week on main, Monday and Thursday at 05:17 UTC, which keeps each
# site's cache in use (GitHub drops a cache not read for 7 days, after which
# every pull request would execute every page) and catches a new container
# image between pushes. sync.yml pushes its pin commits with GITHUB_TOKEN,
# which starts no run here. drift-check.yml's refresh pull request touches
# lectures/, so it is built like any other (its run waits for a maintainer's
# approval, as that workflow notes), and so is its merge.
#
# WHAT IT DOES NOT DO (yet): publish; build the PDF or the notebooks (dp
# publishes HTML alone); post a preview (QuantEcon/actions#336); build on
# mystmd (QuantEcon/actions#337); build only the sites whose toc lists a
# changed file.

on:
  push:
    branches: [main]
    paths:
      - 'lectures/**'
      - 'sites/**'
      - 'tools/sync'
      - 'tools/stage-site'
      - 'tools/site-matrix'
      - 'tools/execution-report'
      - 'sync/manifest.yml'
      - 'sync/state.yml'
      - '.github/workflows/site-build.yml'
  # The same paths: keep the two lists in step.
  pull_request:
    paths:
      - 'lectures/**'
      - 'sites/**'
      - 'tools/sync'
      - 'tools/stage-site'
      - 'tools/site-matrix'
      - 'tools/execution-report'
      - 'sync/manifest.yml'
      - 'sync/state.yml'
      - '.github/workflows/site-build.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1,4'

permissions:
  contents: read

# One run per branch or pull request at a time. A newer push to a pull request
# cancels its running build; on main a run is never cancelled, since it saves
# the cache the pull requests restore.
concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The sites this workflow builds, by folder under sites/, separated by
  # spaces. A site is added when it is brought through (QuantEcon/project-monorepo#77).
  SITES: dp

defaults:
  run:
    shell: bash

jobs:
  sites:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Read each site's site.yml
        id: matrix
        run: |
          read -ra keys <<< "$SITES"
          matrix=$(uv run --script tools/site-matrix "${keys[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  build:
    name: ${{ matrix.site.key }}
    needs: sites
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.matrix) }}
    runs-on: ${{ matrix.site.runs_on }}
    timeout-minutes: ${{ matrix.site.timeout_minutes }}
    container:
      image: ${{ matrix.site.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The image's Python has PyYAML, tools/sync's one dependency, and git, so
      # the tools run with `python`, with no uv to install. tools/stage-site
      # and tools/execution-report need the standard library alone.
      - name: Reconstruct the series' files at its pin
        env:
          KEY: ${{ matrix.site.key }}
        run: python tools/sync "$KEY"

      - name: Name the site's cache and its key
        id: site
        env:
          KEY: ${{ matrix.site.key }}
          ENV_HASH: ${{ hashFiles(format('mirror/{0}/environment.yml', matrix.site.key)) }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$ENV_HASH" ]; then
            echo "::error::mirror/$KEY/environment.yml does not exist, so the cache has no key: tools/sync did not reconstruct it"
            exit 1
          fi
          {
            echo "cache-path=_build/jupyter_cache/$KEY"
            echo "cache-prefix=jb1-$KEY-$ENV_HASH-"
            echo "cache-key=jb1-$KEY-$ENV_HASH-$RUN"
          } >> "$GITHUB_OUTPUT"

      # The primary key carries this run's ID, so it never matches: the
      # restore always takes the newest cache saved under the prefix.
      - name: Restore the site's execution cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.site.outputs.cache-path }}
          key: ${{ steps.site.outputs.cache-key }}
          restore-keys: ${{ steps.site.outputs.cache-prefix }}

      - name: Report the cache restored
        env:
          KEY: ${{ matrix.site.key }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
          PREFIX: ${{ steps.site.outputs.cache-prefix }}
        run: |
          if [ -n "$MATCHED" ]; then
            line="Execution cache restored: \`$MATCHED\`."
          else
            line="No execution cache under \`$PREFIX\`: every page is executed."
          fi
          echo "$line"
          printf '### Site %s\n\n%s\n\n' "\`$KEY\`" "$line" >> "$GITHUB_STEP_SUMMARY"

      # Its pages, its files, its _config.yml and its _toc.yml, into lectures/.
      - name: Stage the site
        id: stage
        env:
          KEY: ${{ matrix.site.key }}
        run: python tools/stage-site "$KEY"

      - name: Note the build's start
        id: start
        run: echo "since=$(date +%s)" >> "$GITHUB_OUTPUT"

      # With the site staged, lectures/ holds its _config.yml and _toc.yml, so
      # jb needs no --config or --toc. extra-args replaces build-lectures'
      # default, so it keeps -W; nitpick adds -n.
      - name: Build the site's HTML (strict)
        id: build
        uses: quantecon/actions/build-lectures@v0
        with:
          builder: html
          source-dir: lectures
          extra-args: -W --keep-going
          upload-failure-reports: true
          failure-artifact-name: execution-reports-${{ matrix.site.key }}

      # A login shell, as build-lectures runs jb, so this is the Python that
      # ran the build: the report unpickles Sphinx's environment.
      - name: Write the execution report
        id: report
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        shell: bash -l {0}
        env:
          KEY: ${{ matrix.site.key }}
          SINCE: ${{ steps.start.outputs.since }}
        run: python tools/execution-report --site "$KEY" --since "$SINCE" --out _build/execution_status.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the execution report
        if: ${{ !cancelled() && steps.report.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: execution-status-${{ matrix.site.key }}
          path: _build/execution_status.json
          if-no-files-found: warn

      - name: Keep the site's HTML
        uses: actions/upload-artifact@v4
        with:
          name: html-${{ matrix.site.key }}
          path: _build/html
          retention-days: 7

      - name: Save the execution cache
        if: success() && github.ref == 'refs/heads/main' && steps.report.outputs.executed != '0'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.site.outputs.cache-path }}
          key: ${{ steps.site.outputs.cache-key }}

      - name: Unstage the site
        if: ${{ always() && steps.stage.outcome != 'skipped' }}
        env:
          KEY: ${{ matrix.site.key }}
        run: python tools/stage-site --clean "$KEY"
