name: drift-check

# Prove the pool still equals its sources after every sync, and turn what it
# finds into the right artefact:
#
#   * a pool file no longer equals rewrites(canonical)   -> this job goes RED
#   * a non-canonical copy diverged, or a watched toc     -> a `drift` issue
#     changed                                                (closes itself when
#                                                            the finding clears)
#   * the canonical copy moved upstream                   -> `promote --refresh`
#                                                            on a branch, and a
#                                                            pull request
#
# tools/drift-check does the comparison; see its docstring for the outcomes.
# Runs after the `sync` workflow completes (so it sees the fresh pins), on
# demand, and on pull requests that touch the pool, the ledger or the tools
# (report only — no issues, no refresh PR).
#
# The merged bibliography rides the same path. tools/bib-merge regenerates
# lectures/_static/quant-econ.bib in memory and compares it with the committed
# file: one that is behind the series' bibliographies is refreshed into the
# same pull request (written after promote, so its citation check sees the
# refreshed pool). A key it refuses (a conflict without a ruling in
# sync/bib.yml, or a ruling a copy has reopened) keeps its committed entry and
# is listed in that pull request. Anything bib-merge fails on (a refused key,
# a failed check, a hand edit, a ruling not regenerated) turns the separate
# `bibliography` job RED, never the check job, so it cannot hold back the
# refresh of the pool lectures.
#
# The refresh lands as a pull request rather than a push to main so a human
# sees the ledger diff: a refresh can change which entries are `interim`.
# An entry whose refresh fails does not hold the others back: promote still
# writes every entry it could refresh, the pull request is opened with those
# and lists each failure with promote's reason, and the run is marked RED.
# Reasons include a same-name copy edited to differ (settled by
# sync/canonical.yml or upstream), a sync/canonical.yml line naming a copy
# that has fallen behind, a canonical copy removed or renamed upstream, an
# asset that cannot be moved or overwritten, and a canonical series this run
# excludes. A merely stale copy stays a source and does not fail.
# A refused entry keeps its old ledger record, so while its canonical copy
# differs from that record the drift-check asks for a refresh every night:
# the run stays red until the entry is settled, and a settlement applies the
# next night. An entry refused when only its series' pin moved (its canonical
# copy unchanged) is retried only when some canonical copy next moves (#20).
# PERMISSIONS: uses the default GITHUB_TOKEN. A PR opened with it does start
# this workflow's own pull_request run, but the repository's approval policy
# (all external contributors) holds that run until a maintainer approves it:
# approve it when reviewing the refresh PR. Once branch protection is on, the
# push to `drift/refresh` still works (it is not a protected branch).

on:
  workflow_run:
    workflows: [sync]
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths:
      - 'lectures/**'
      - 'sync/**'
      - 'tools/**'
      - '.github/workflows/drift-check.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: drift-check
  cancel-in-progress: false

env:
  # Series every refresh leaves out (promote --exclude). `dp`: the real dp
  # series is excluded while the dp-test sandbox stands in for it (M2 posture,
  # PLAN.md); it leaves this list at QuantEcon/project-monorepo#24. `jax`: it
  # used to be excluded inside tools/promote and is now excluded here, by the
  # same per-run flag. With jax considered, short_path fails the refresh
  # (intro's and jax's are different lectures), while ifp_egm's
  # sync/canonical.yml line records jax's copy as divergent instead; drop jax
  # when its renames land (QuantEcon/project-monorepo#76). A refresh fails an
  # entry whose canonical series is excluded once that series' pin moves, so
  # jax must leave this list before any jax-only lecture is promoted. An
  # empty list is fine: the flag is then left off.
  PROMOTE_EXCLUDE: dp jax

jobs:
  check:
    # After a sync, only run when the sync itself succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      refresh_needed: ${{ steps.check.outputs.refresh_needed }}
      violations: ${{ steps.check.outputs.violations }}
      drift: ${{ steps.check.outputs.drift }}
      refresh: ${{ steps.check.outputs.refresh }}
      bib_refresh: ${{ steps.bib.outputs.bib_refresh }}
      bib_failed: ${{ steps.bib.outputs.bib_failed }}
      bib_state: ${{ steps.bib.outputs.bib_state }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A workflow_run event carries the default branch's current commit,
          # which already includes the pins the sync just pushed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Reconstruct the mirror and check the pool against it
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run --script tools/drift-check --reconstruct --json drift-report.json --print-issues
          else
            uv run --script tools/drift-check --reconstruct --json drift-report.json --issues
          fi
          rc=$?
          set -e
          echo "drift-check exit status: $rc (0 clean, 1 findings handled below, 2 violation)"
          test "$rc" -le 1

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.json
          if-no-files-found: ignore

      - name: Check the merged bibliography
        id: bib
        # Runs whatever the drift-check found, so both reports are in the log.
        # Its outcome travels as outputs: bib_refresh starts the refresh job,
        # bib_failed turns the `bibliography` job red. It fails this job only
        # when bib-merge reported nothing at all (it could not start).
        if: success() || failure()
        run: |
          set +e
          uv run --script tools/bib-merge --reconstruct
          rc=$?
          set -e
          echo "bib-merge exit status: $rc (0 clean, 1 behind the series' files, 2 refused, failed or an error)"
          if ! grep -q '^bib_state=' "$GITHUB_OUTPUT"; then
            echo "::error::tools/bib-merge exited $rc without reporting a state: it did not start."
            exit 1
          fi

  bibliography:
    # Red while the merged bibliography is not settled, in its own job so that
    # it never skips the refresh job (whose pull request lists a refused key).
    needs: check
    if: always() && needs.check.outputs.bib_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Keep the run red while the merged bibliography is not settled
        run: |
          echo "::error::tools/bib-merge found a refused key, a failed check, a hand edit or a ruling that was not regenerated (state: ${{ needs.check.outputs.bib_state }}). The check job's bibliography step gives each line; tools/bib-merge --propose prints a sealed stub for a refused key."
          exit 1

  refresh:
    needs: check
    if: (needs.check.outputs.refresh_needed == 'true' || needs.check.outputs.bib_refresh == 'true') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Reconstruct every series (promotion dedups across all of them)
        run: uv run --script tools/sync

      - name: Refresh the pool entries whose canonical source moved
        id: refresh
        # promote writes every entry it can refresh and exits 1 if any entry
        # failed. The exit status is kept, not acted on here, so the entries
        # that did refresh still reach the pull request below; the last step
        # turns the run red. Skipped when only the bibliography needs a
        # refresh, so a quiet night re-anchors nothing in the ledger.
        if: needs.check.outputs.refresh_needed == 'true'
        run: |
          set +e
          uv run --script tools/promote --refresh ${PROMOTE_EXCLUDE:+--exclude $PROMOTE_EXCLUDE} 2>&1 | tee promote.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = 0 ]; then
            echo "promote --refresh exit status: 0 (every entry refreshed, or nothing to refresh)"
          elif grep -q '^summary \[refresh\]' promote.log; then
            echo "promote --refresh exit status: $rc (some entries were refused -- see the FAILED lines)"
          else
            echo "promote --refresh exit status: $rc (it stopped before its summary -- see the next step)"
          fi

      - name: Regenerate the merged bibliography
        id: bib
        # After promote, so the citation check sees the refreshed pool. A
        # refused key keeps its committed entry; the exit status is kept, not
        # acted on here, and the last step turns the run red.
        run: |
          set +e
          uv run --script tools/bib-merge --write 2>&1 | tee bib.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Open or update the refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A failing promote prints its summary only after every write, the
          # ledger included. A non-zero exit without it means the run stopped
          # before or during its writes (a configuration error, or a crash; not
          # a refused entry), so what is on disk may be half-written: open nothing.
          # promote is skipped on a night when only the bibliography moved.
          prc="${{ steps.refresh.outputs.rc }}"
          [ -n "$prc" ] || prc=0
          [ -f promote.log ] || : > promote.log
          if [ "$prc" != "0" ] && ! grep -q '^summary \[refresh\]' promote.log; then
            echo "::error::tools/promote --refresh exited $prc before its summary: a configuration error (see the error line in the refresh step) or a crash part-way. Its writes may be partial, so no pull request is opened."
            exit 1
          fi
          failed=$(grep -E '^\[[^]]+\] FAILED: ' promote.log || true)
          bibfail=$(grep -E '^(\[(refused|style|closure|equivalence|violation|write-refused)\]|bib-merge: )' bib.log || true)
          git add lectures sync/ledger.yml
          if git diff --cached --quiet; then
            if [ -n "$failed" ]; then
              echo 'promote --refresh refreshed nothing; every entry it tried failed:'
              echo "$failed"
            fi
            if [ -n "$bibfail" ]; then
              echo 'bib-merge --write changed nothing it could write; it found:'
              echo "$bibfail"
            fi
            [ -n "$failed$bibfail" ] || echo 'promote --refresh and bib-merge --write changed nothing -- no pull request.'
            exit 0
          fi
          before=$(git show HEAD:sync/ledger.yml | grep -c 'interim: true' || true)
          after=$(grep -c 'interim: true' sync/ledger.yml || true)
          n=$(git diff --cached --name-only -- lectures | grep -c '\.md$' || true)
          bib=$(git diff --cached --name-only -- lectures/_static/quant-econ.bib | grep -c . || true)
          # Every staged pool change other than the bibliography: lectures,
          # assets, the ledger.
          pool=$(git diff --cached --name-only -- lectures sync/ledger.yml | grep -vxc 'lectures/_static/quant-econ.bib' || true)
          if [ "$pool" -gt 0 ] && [ "$bib" -gt 0 ]; then
            title="promote: refresh $n pool lectures and the merged bibliography"
          elif [ "$pool" -gt 0 ]; then
            title="promote: refresh $n pool lectures whose canonical source moved"
          else
            title="bib-merge: refresh the merged bibliography from the series' files"
          fi
          git switch -c drift/refresh
          git commit -m "$title"
          git push --force -u origin drift/refresh
          {
            if [ "$pool" -gt 0 ] || [ -n "$failed" ]; then
            echo "\`tools/drift-check\` found pool entries whose **canonical copy moved upstream**; \`tools/promote --refresh${PROMOTE_EXCLUDE:+ --exclude $PROMOTE_EXCLUDE}\` re-promoted them. Review the ledger diff, not just the lecture text: a refresh re-resolves every source, so an entry whose other copies went stale can change shape."
            echo
            echo "| | before | after |"
            echo "|---|---|---|"
            echo "| \`interim: true\` ledger entries | $before | $after |"
            echo "| lectures re-copied | | $n |"
            fi
            if [ "$bib" -gt 0 ] || [ -n "$bibfail" ]; then
              echo
              if [ "$bib" -gt 0 ]; then
                echo "**The merged bibliography.** \`tools/bib-merge --write\` regenerated \`lectures/_static/quant-econ.bib\` from the series' own files and the rulings in \`sync/bib.yml\` ($(grep -m1 '^keys ' bib.log || true)). Review the entries it changed: each comes from a series' file, normalised to the house style, or from a ruling."
              else
                echo "**The merged bibliography was not refreshed.** \`lectures/_static/quant-econ.bib\` is unchanged in this pull request."
              fi
              if [ -n "$bibfail" ]; then
                echo
                echo "**Not settled.** \`tools/bib-merge\` found the problems below, so the run that opened this PR is red. A refused key keeps the entry the committed file already had. A conflict without a ruling, or a ruling a copy has reopened, is settled by a ruling in \`sync/bib.yml\`: \`tools/bib-merge --propose\` prints a stub, sealed against the current copies. A citation that does not resolve, or an entry that breaks the house style, is settled upstream or by a ruling that fixes the entry."
                echo
                echo '```'
                echo "$bibfail"
                echo '```'
              fi
            fi
            if [ -n "$failed" ]; then
              echo
              echo "**Not refreshed.** \`tools/promote\` refused these entries, so their pool copies stay at the previous pin and the run that opened this PR is red. Each line gives promote's reason. A same-name copy edited to differ is settled by naming the winning series in \`sync/canonical.yml\` or by reconciling the copies upstream. A \`sync/canonical.yml\` line that names a lagging copy is settled by pointing it at the recorded canonical series or removing it. A canonical copy removed or renamed upstream needs a decision, which the drift-check's \`canonical-removed\` issue tracks. The line itself explains the other reasons. An entry whose canonical copy moved is refused again every night, so the run stays red until it is settled; an entry refused when only its series' pin moved is retried when a canonical copy next moves."
              echo
              echo '```'
              echo "$failed"
              echo '```'
            fi
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The branch is force-pushed from \`${{ github.event.repository.default_branch }}\` on every run that still needs a refresh, so this PR always shows the current delta."
            echo
            echo '```'
            git diff --cached --stat HEAD~1 | tail -n 40
            echo '```'
          } > pr-body.md
          existing=$(gh pr list --head drift/refresh --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file pr-body.md
            echo "updated PR #$existing"
          else
            gh pr create --head drift/refresh --title "$title" --body-file pr-body.md
          fi

      - name: Keep the run red while any entry could not be refreshed
        if: steps.refresh.outcome == 'success' && steps.refresh.outputs.rc != '0'
        run: |
          echo "::error::tools/promote --refresh could not refresh every entry (exit ${{ steps.refresh.outputs.rc }}). The FAILED lines in the refresh step give each entry and promote's reason; any entries it did refresh are in the drift/refresh pull request."
          exit 1

      - name: Keep the run red while the merged bibliography is not settled
        if: always() && steps.bib.outcome == 'success' && steps.bib.outputs.rc != '0'
        run: |
          echo "::error::tools/bib-merge --write exited ${{ steps.bib.outputs.rc }}. The [refused], [style], [closure] and [equivalence] lines in the bibliography step give each key and the reason; every key it could merge is in the drift/refresh pull request."
          exit 1
