name: pool-check

# Check that the pool keeps its layout conventions (tools/pool-check): a flat
# lectures/ of <slug>.md files and _static/; every folder in _static/ a
# lecture's own or _shared/; every asset reference file-relative, inside the
# pool, and used only by the lecture whose folder holds it; every {doc} link
# to a pool lecture, a site page or another series. It also checks the
# sites, sites/<key>/: every _toc.yml entry is a pool lecture or a page of
# the site, no site page or file shares a path with the pool's (staging would
# overwrite it), the branding a _config.yml names is in the site, the
# cross-reference rules hold, and site.yml has the fields the build reads.
# And it checks the one environment the sites are to build in,
# _base/environment-update.yml: every package a pool lecture's code cell
# installs is listed there, pinned to one version that a pip install line's
# own limit allows, so a refreshed lecture that installs a new package turns
# this check red until a person pins it on main (_base/README.md). It reads lectures/, sites/, that
# file, the series keys in sync/manifest.yml and the ledger, so it needs no
# mirror and no network.
#
# A second step checks the index of shared assets,
# lectures/_static/_shared/README.md (tools/assets-report --check-index): it
# regenerates the index from the pool and the ledger and fails if the
# committed file differs, or if a file under _static/ is used by no lecture.
# After a promotion, run `tools/assets-report --write-index` and commit it.
#
# Names unique across the published sites needs the mirror, so the
# drift-check runs that check (drift-check.yml).
#
# Pull requests and manual runs only, like tests.yml: a push to a branch
# triggers nothing. tools/promote is listed because the check finds
# references with promote's parser, and sync/manifest.yml and sync/ledger.yml
# because a {doc} link's prefix is a series key that holds the lecture.

on:
  pull_request:
    paths:
      - 'lectures/**'
      - 'sites/**'
      - '_base/environment-update.yml'
      - 'tools/pool-check'
      - 'tools/assets-report'
      - 'tools/promote'
      - 'sync/manifest.yml'
      - 'sync/ledger.yml'
      - '.github/workflows/pool-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check the pool's conventions
        run: uv run --script tools/pool-check

      - name: Check the shared-asset index and the pool's orphans
        if: success() || failure()
        run: uv run --script tools/assets-report --check-index
